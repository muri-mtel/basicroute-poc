<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>basicrouter</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-feature-settings:'cv11' 1,'ss01' 1}
:root{
  /* Legacy tokens — kept for JS compatibility */
  --blue-900:#0d1f3c;--blue-800:#142a50;--blue-700:#1a3666;--blue-600:#1d4ed8;
  --blue-500:#2563eb;--blue-400:#3b82f6;--blue-300:#93c5fd;--blue-200:#bfdbfe;
  --blue-100:#dbeafe;--blue-50:#eff6ff;
  --n900:#0f172a;--n800:#1e293b;--n700:#334155;--n600:#475569;--n500:#64748b;
  --n400:#94a3b8;--n300:#cbd5e1;--n200:#e2e8f0;--n100:#f1f5f9;--n50:#f8fafc;
  --white:#ffffff;--success:#16a34a;--success-light:#dcfce7;
  /* Semantic design tokens */
  --accent:#2563eb;--accent-hover:#1d4ed8;--accent-light:#eff6ff;--accent-border:#bfdbfe;
  --bg:#f8fafc;--surface:#ffffff;--border:#e2e8f0;--border-strong:#cbd5e1;
  --text-primary:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;
  --sidebar-bg:#0c0c0f
}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;color:var(--text-primary);background:var(--bg);height:100vh;overflow:hidden}
.app{display:flex;height:100vh}

/* Sidebar */
.sidebar{width:220px;min-width:220px;background:var(--sidebar-bg);display:flex;flex-direction:column;height:100vh;border-right:1px solid rgba(255,255,255,.04)}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.logo-icon{width:30px;height:30px;background:#1e1e26;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid rgba(255,255,255,.08)}
.logo-text{color:#ffffff;font-size:14px;font-weight:600;letter-spacing:-.3px}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-section{margin-bottom:4px}
.nav-label{font-size:10px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.2);text-transform:uppercase;padding:10px 16px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;cursor:pointer;color:rgba(255,255,255,.45);font-size:13px;font-weight:400;border-radius:7px;margin:1px 8px;transition:background .12s,color .12s;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.8)}
.nav-item.active{background:rgba(255,255,255,.08);color:#ffffff;box-shadow:inset 2px 0 0 var(--accent)}
.nav-item.ghost{opacity:.3;cursor:default;pointer-events:none}
.nav-icon{width:15px;height:15px;opacity:.7;flex-shrink:0}
.sidebar-credits{padding:14px 16px;border-top:1px solid rgba(255,255,255,.06)}
.credits-label{font-size:10px;color:rgba(255,255,255,.22);font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px}
.credits-bar-bg{height:3px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-bottom:6px}
.credits-bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width 1s ease}
.credits-count{font-size:11px;color:rgba(255,255,255,.3);font-weight:500}

/* Header */
.header{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted)}
.breadcrumb span{color:var(--text-secondary);font-weight:500}
.breadcrumb .bc-sep{color:var(--border-strong)}
.header-right{display:flex;align-items:center;gap:12px}
.org-name{font-size:13px;font-weight:500;color:var(--text-secondary)}
.vdivider{width:1px;height:20px;background:var(--border)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-light);color:var(--accent);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.content{flex:1;overflow-y:auto;padding:28px 32px}

/* Screen transitions */
.screen-enter{animation:screenIn 220ms ease forwards}
@keyframes screenIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;font-family:inherit;font-weight:500;cursor:pointer;border:none;transition:background .12s,border-color .12s,color .12s;white-space:nowrap;letter-spacing:-.01em}
.btn-p{background:var(--accent);color:#ffffff;padding:8px 16px;font-size:13px}
.btn-p:hover{background:var(--accent-hover)}
.btn-p.lg{padding:10px 20px;font-size:14px}
.btn-s{background:var(--surface);color:var(--text-secondary);padding:8px 14px;font-size:13px;border:1px solid var(--border)}
.btn-s:hover{background:var(--bg);border-color:var(--border-strong)}
.btn-o{background:transparent;color:var(--text-secondary);border:1px solid var(--border);padding:6px 11px;font-size:12px}
.btn-o:hover{border-color:var(--accent-border);color:var(--accent);background:var(--accent-light)}
.btn-warn{background:#f59e0b;color:#ffffff;padding:8px 16px;font-size:13px}
.btn-warn:hover{background:#d97706}
.btn-warn.lg{padding:10px 20px;font-size:14px}

/* Badges */
.badge{display:inline-flex;align-items:center;border-radius:20px;padding:3px 8px;font-size:11px;font-weight:500}
.badge-blue{background:var(--accent-light);color:var(--accent);border:1px solid var(--accent-border)}
.badge-green{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.badge-orange{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
.badge-gray{background:var(--n100);color:var(--n500);border:1px solid var(--border)}
.badge-red{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-header-left{display:flex;align-items:center;gap:8px}
.card-title{font-size:14px;font-weight:600;color:var(--text-primary)}
.card-body{padding:18px 20px}

/* Stat cards */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.stat-label{font-size:11px;font-weight:500;color:var(--text-muted);margin-bottom:6px;text-transform:none;letter-spacing:0}
.stat-value{font-size:28px;font-weight:700;letter-spacing:-.03em;color:var(--text-primary);margin-bottom:3px}
.stat-delta{font-size:11px;font-weight:500;color:var(--success)}

/* Grid layouts */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px}

/* Form fields */
.field-group{margin-bottom:14px}
.field-label{font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:5px;text-transform:none;letter-spacing:0}
.field-value{min-height:34px;border-radius:8px;padding:8px 11px;font-size:13px;font-family:inherit;transition:all .15s ease;border:1px solid var(--border)}
.field-empty{background:var(--bg);border-color:var(--border);color:var(--text-muted)}
.field-filled{background:var(--accent-light);border-color:var(--accent-border);color:var(--text-primary)}
.field-input{background:var(--surface);border-color:var(--border);color:var(--text-primary);outline:none;width:100%}
.field-input:focus{border-color:var(--accent);background:var(--accent-light);box-shadow:0 0 0 3px rgba(37,99,235,.08)}

/* Chat */
.chat-area{display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:340px;padding-right:4px}
.chat-row{display:flex;align-items:flex-end;gap:8px}
.chat-row.user{flex-direction:row-reverse}
.chat-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex-shrink:0}
.av-ai{background:#0c0c0f;color:#ffffff}
.av-user{background:var(--border);color:var(--text-secondary)}
.chat-bubble{max-width:82%;padding:10px 13px;border-radius:16px;font-size:13px;line-height:1.5}
.bubble-ai{background:var(--bg);color:var(--text-primary);border:1px solid var(--border);border-bottom-left-radius:4px}
.bubble-user{background:var(--accent);color:#ffffff;border-bottom-right-radius:4px}
.bubble-ghost{background:rgba(37,99,235,.18);color:#ffffff;border:1px dashed rgba(37,99,235,.45);border-bottom-right-radius:4px;cursor:pointer;position:relative}
.bubble-ghost:hover{background:rgba(37,99,235,.28)}
.ghost-hint{font-size:10px;opacity:.7;margin-top:3px}

/* Typing dots */
.typing-dots{display:flex;gap:4px;align-items:center;padding:4px 0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted)}
.dot:nth-child(1){animation:pulse 1s infinite 0s}
.dot:nth-child(2){animation:pulse 1s infinite .2s}
.dot:nth-child(3){animation:pulse 1s infinite .4s}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

/* Loading steps */
.step-row{display:flex;align-items:center;gap:12px;padding:12px 0}
.step-row+.step-row{border-top:1px solid var(--bg)}
.step-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .3s}
.step-dot.pending{background:var(--border-strong)}
.step-dot.active{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.step-dot.done{background:var(--success)}
.step-text{font-size:13px;display:flex;align-items:center;gap:6px}
.step-text.pending{color:var(--text-muted)}
.step-text.active{color:var(--text-primary);font-weight:500}
.step-text.done{color:var(--text-secondary)}

/* Phone frame (legacy) */
.phone-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.phone{width:155px;border-radius:22px;background:#111;border:1.5px solid #333;box-shadow:0 8px 32px rgba(0,0,0,.3);overflow:hidden;position:relative}
.phone-notch{background:#111;text-align:center;padding:6px 0 4px;display:flex;justify-content:center}
.phone-notch-dot{width:8px;height:8px;background:#222;border-radius:50%}
.phone-video{height:200px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;position:relative}
.phone-actions{position:absolute;right:8px;bottom:12px;display:flex;flex-direction:column;gap:10px}
.phone-action-btn{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#ffffff;font-size:12px}
.phone-action-label{font-size:8px;color:rgba(255,255,255,.6);text-align:center;margin-top:1px}
.phone-bottom{background:#000;padding:8px 10px 10px}
.phone-username{color:#ffffff;font-size:10px;font-weight:700;margin-bottom:3px}
.phone-caption{color:rgba(255,255,255,.85);font-size:9px;line-height:1.4;margin-bottom:3px}
.phone-hashtags{color:#4cc9f0;font-size:9px}

/* Bar chart */
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:60px}
.bar{border-radius:3px 3px 0 0;flex:1;min-width:0}

/* Post breakdown */
.post-row{display:flex;align-items:center;padding:10px 12px;border-radius:8px;gap:12px;font-size:13px}
.post-row.highlight{background:var(--accent-light);border:1px solid var(--accent-border)}
.post-row:not(.highlight){border:1px solid transparent}
.post-name{flex:1;font-weight:500;color:var(--text-primary)}
.post-stat{color:var(--text-muted);min-width:50px;text-align:right}

/* Upload drop zone */
.dropzone{border:1.5px dashed var(--border-strong);border-radius:12px;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-muted);text-align:center;transition:border-color .15s;background:var(--bg)}
.dropzone-icon{width:40px;height:40px;background:var(--accent-light);border-radius:10px;display:flex;align-items:center;justify-content:center}

/* Misc */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.page-title{font-size:20px;font-weight:600;color:var(--text-primary);margin-bottom:4px;letter-spacing:-.02em}
.page-sub{font-size:13px;color:var(--text-muted);margin-top:2px}
.bottom-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.bottom-bar-left{font-size:13px;color:var(--text-secondary)}
.section-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-heading{font-size:15px;font-weight:600;color:var(--text-primary);letter-spacing:-.01em}
.color-swatch{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.8);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.detected-panel{background:var(--accent-light);border:1px solid var(--accent-border);border-radius:10px;padding:14px 16px;margin-top:14px}
.swatches-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* AI rec panel */
.ai-rec{background:#fafbff;border:1px solid var(--accent-border);border-radius:12px;padding:20px;margin-top:20px}
.ai-rec-label{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}

/* Engagement section */
.chart-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text-muted)}
.chart-mid{text-align:center;color:var(--accent);font-weight:500}

/* Approved brief banner */
.brief-banner{background:var(--success);color:#ffffff;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:500;margin-bottom:16px}

/* Image placeholder tiles */
.img-tile{background:var(--n100);border:1.5px dashed var(--border-strong);border-radius:8px;height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text-muted);font-size:11px}
.img-tile-label{font-size:12px;font-weight:500;color:var(--text-secondary)}

/* Campaign list */
.campaign-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:20px;cursor:pointer;transition:border-color .15s;margin-bottom:10px}
.campaign-item:hover{border-color:var(--accent-border)}
.campaign-item-info{flex:1;min-width:0}
.campaign-name-row{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:4px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.campaign-meta{font-size:12px;color:var(--text-muted)}
.campaign-thumbs{display:flex;gap:3px}
.campaign-thumb{width:56px;height:56px;border-radius:8px;flex-shrink:0;object-fit:cover;display:block}

/* Version badges */
.version-track{display:flex;align-items:center;gap:4px;margin-top:6px}
.vbadge{display:inline-flex;align-items:center;border-radius:4px;padding:2px 6px;font-size:10px;font-weight:600;background:var(--n100);color:var(--n500)}
.vbadge.current{background:var(--accent);color:#ffffff}
.vbadge.done{background:var(--accent-light);color:var(--accent)}
.v-arrow{font-size:9px;color:var(--border-strong)}

/* Mini sparkline */
.mini-sparkline{display:flex;align-items:flex-end;gap:2px;height:22px;margin-top:6px}
.spark-bar{width:9px;border-radius:2px 2px 0 0;background:var(--accent-border)}
.spark-bar.peak{background:var(--accent)}

/* Brand identity zones */
.identity-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.identity-zone{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.identity-zone-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.identity-zone-title{font-size:13px;font-weight:600;color:var(--text-primary)}
.identity-zone-body{padding:14px 16px}

/* Prompt collapse section */
.prompt-section{background:var(--bg);border:1px solid var(--border);border-radius:10px;margin-bottom:16px;overflow:hidden}
.prompt-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none;font-size:12px;color:var(--text-secondary);font-weight:500}
.prompt-toggle:hover{background:var(--n100)}
.prompt-body{padding:12px 14px;border-top:1px solid var(--border)}
.prompt-code{font-family:'SF Mono',Monaco,Consolas,monospace;font-size:11px;line-height:1.7;color:var(--text-secondary);white-space:pre-wrap}

/* Final version */
.fv-posts{display:flex;gap:8px;margin-bottom:6px}
.fv-post{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.fv-thumb{width:100%;height:160px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;position:relative;overflow:hidden}
.fv-thumb.best{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.fv-post-label{font-size:11px;color:var(--text-muted);font-weight:500}

/* BytePlus panel */
.byteplus-panel{background:#fffdf5;border:1px solid #fcd34d;border-radius:12px;padding:20px;margin-top:20px}
.byteplus-label{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#92400e;margin-bottom:8px}
.byteplus-verdict{font-size:13px;color:var(--text-secondary);margin-bottom:14px;line-height:1.5}
.suggestion-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.suggestion-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text-secondary);line-height:1.5}
.suggestion-dot{width:6px;height:6px;border-radius:50%;background:#f59e0b;flex-shrink:0;margin-top:5px}
.regen-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.regen-input{flex:1;min-width:180px;padding:8px 11px;border-radius:8px;border:1px solid #fcd34d;font-size:13px;font-family:inherit;background:var(--surface);outline:none}
.regen-input:focus{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.1)}

/* Strong panel */
.strong-panel{background:#f7fef9;border:1px solid #86efac;border-radius:12px;padding:20px;margin-top:20px}
.strong-label{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#15803d;margin-bottom:8px}

/* Checkbox row */
.checkbox-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--accent-light);border:1px solid var(--accent-border);border-radius:8px;cursor:pointer;user-select:none;margin-top:12px}
.checkbox-row input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:var(--accent);flex-shrink:0}
</style>
</head>
<body>
<div id="root"></div>
<script>
const h = React.createElement;
const {useState, useEffect, useRef} = React;

// SVG icons
const WindIcon = () => h('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'#93c5fd',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},
  h('path',{d:'M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2'}));

const CheckIcon = () => h('svg',{width:12,height:12,viewBox:'0 0 24 24',fill:'none',stroke:'#16a34a',strokeWidth:3,strokeLinecap:'round',strokeLinejoin:'round'},
  h('polyline',{points:'20 6 9 17 4 12'}));

const SparkleIcon = () => h('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:'currentColor'},
  h('path',{d:'M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z'}));

const UploadIcon = () => h('svg',{width:22,height:22,viewBox:'0 0 24 24',fill:'none',stroke:'#93c5fd',strokeWidth:1.5,strokeLinecap:'round',strokeLinejoin:'round'},
  h('polyline',{points:'16 16 12 12 8 16'}),h('line',{x1:12,y1:12,x2:12,y2:21}),
  h('path',{d:'M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3'}));

const CalIcon = () => h('svg',{width:28,height:28,viewBox:'0 0 24 24',fill:'none',stroke:'#3b82f6',strokeWidth:1.5,strokeLinecap:'round',strokeLinejoin:'round'},
  h('rect',{x:3,y:4,width:18,height:18,rx:2,ry:2}),h('line',{x1:16,y1:2,x2:16,y2:6}),
  h('line',{x1:8,y1:2,x2:8,y2:6}),h('line',{x1:3,y1:10,x2:21,y2:10}));

// ── Sidebar ─────────────────────────────────────────────────────────────────
function Sidebar({screen, onNav, credits}) {
  const pct = credits;
  const raw = Math.round(credits * 8.4);

  const activeMap = {
    dashboard:'dashboard',
    brandIdentity:'brandIdentity',
    upload:'dashboard',
    briefing:'dashboard',
    loading:'dashboard',
    nodes:'dashboard',
    finalVersion:'dashboard',
  };

const EXCHANGES = [
  {
    ai: "I can see Lumeo has a soft, pastel aesthetic — really clean and organic. Are you keeping that same tone for this campaign, or going for something bolder?",
    user: "Same tone — soft and natural. Our audience responds well to it.",
    fields: {brandTone:'Soft & organic', visualMood:'Clean, natural, minimal'}
  },
  {
    ai: "Got it. What's the main goal for this campaign — building brand awareness, or direct lead capture?",
    user: "Lead capture. We want people clicking through to our site.",
    fields: {campaignObjective:'Lead capture', callToAction:'Link in bio — product page'}
  },
  {
    ai: "Based on lead capture, I'd actually recommend 4 posts per week instead of 2. Higher frequency builds trust faster on TikTok — especially with a new audience. Shall I plan for that?",
    user: "Yes, let's do 4 per week.",
    fields: {postingFrequency:'4 posts / week', campaignDuration:'4 weeks · 16 posts total'}
  },
];

const FINAL_AI = "Brief is complete. Review it on the left and approve when you're ready.";

function S3({onNav, onCredits}) {
  const [step, setStep] = useState(0);
  const [brief, setBrief] = useState({
    brand:'Lumeo Skincare', platform:'TikTok', targetRegion:'Southeast Asia',
    campaignObjective:'', brandTone:'', visualMood:'', callToAction:'',
    postingFrequency:'', campaignDuration:''
  });
  const chatEndRef = useRef(null);

  useEffect(()=>{
    if(chatEndRef.current) chatEndRef.current.scrollIntoView({behavior:'smooth'});
  },[step]);

  const handleGhostClick = (idx) => {
    const ex = EXCHANGES[idx];
    setBrief(prev => ({...prev, ...ex.fields}));
    onCredits(-8);
    const nextStep = (idx+1) * 2;
    setTimeout(()=>{ setStep(nextStep); }, 400);
  };

  const messages = [];
  for(let i = 0; i < 3; i++) {
    const typingStep = i * 2;
    const ghostStep = i * 2 + 1;
    if(step >= typingStep) {
      const isTyping = step === typingStep;
      messages.push({type:'ai', text:EXCHANGES[i].ai, typing:isTyping, key:`ai${i}`});
      if(!isTyping) {
        const replied = step > ghostStep;
        messages.push({type:'user', text:EXCHANGES[i].user, ghost:!replied, idx:i, key:`user${i}`});
      }
    }
  }
  if(step === 6) messages.push({type:'ai', text:FINAL_AI, typing:true, key:'ai-final'});
  if(step === 7) messages.push({type:'ai', text:FINAL_AI, typing:false, key:'ai-final'});

  const allDone = step >= 7;

  const briefFields = [
    {label:'Brand', key:'brand'},
    {label:'Platform', key:'platform'},
    {label:'Target region', key:'targetRegion'},
    {label:'Campaign objective', key:'campaignObjective'},
    {label:'Brand tone', key:'brandTone'},
    {label:'Visual mood', key:'visualMood'},
    {label:'Call to action', key:'callToAction'},
    {label:'Posting frequency', key:'postingFrequency'},
    {label:'Campaign duration', key:'campaignDuration'},
  ];

  return h('div',{className:'content screen-enter'},
    h('div',{className:'grid-2'},
      h('div',{className:'card'},
        h('div',{className:'card-header'},
          h('div',{className:'card-header-left'},
            h('span',{className:'card-title'},'Brief'),
            allDone && h('span',{className:'badge badge-green'},'Ready to review')
          )
        ),
        h('div',{className:'card-body'},
          briefFields.map(f => h('div',{className:'field-group', key:f.key},
            h('div',{className:'field-label'},f.label),
            h('div',{
              className:`field-value ${brief[f.key] ? 'field-filled' : 'field-empty'}`
            }, brief[f.key] || 'Waiting...')
          ))
        )
      ),
      h('div',{className:'card'},
        h('div',{className:'card-header'},
          h('div',{className:'card-header-left'},
            h('span',{className:'card-title'},'AI assistant'),
            h('span',{className:'badge badge-blue'},'✦ Active')
          )
        ),
        h('div',{className:'card-body'},
          h(ChatThread, {messages, onGhostClick:handleGhostClick, onTypingDone:(idx)=>{
            if(idx < 3) setStep(idx*2+1);
            else setStep(7);
          }, chatEndRef})
        )
      )
    ),
    allDone && h('div',{className:'bottom-bar'},
      h('div',null,
        h('div',{style:{fontWeight:600,fontSize:14,color:'var(--n800)',marginBottom:3}},'Brief looks good?'),
        h('div',{style:{fontSize:12,color:'var(--n400)'}},'Approving will generate your campaign content using the brief above.')
      ),
      h('button',{className:'btn btn-p lg', onClick:()=>onNav('loading')},'Approve & generate →')
    )
  );
}

function ChatThread({messages, onGhostClick, onTypingDone, chatEndRef}) {
  return h('div',{className:'chat-area'},
    messages.map(msg => {
      if(msg.type === 'ai') {
        return h(AiMessage, {key:msg.key, text:msg.text, typing:msg.typing,
          onDone:()=>{
            const idx = msg.key === 'ai-final' ? 3 : parseInt(msg.key.replace('ai',''));
            onTypingDone(idx);
          }
        });
      } else if(msg.ghost) {
        return h('div',{key:msg.key, className:'chat-row user'},
          h('div',{className:'chat-bubble bubble-ghost', onClick:()=>onGhostClick(msg.idx)},
            h('div',null, msg.text),
            h('div',{className:'ghost-hint'},'· tap to reply')
          ),
          h('div',{className:'chat-avatar av-user'},'LS')
        );
      } else {
        return h('div',{key:msg.key, className:'chat-row user'},
          h('div',{className:'chat-bubble bubble-user'}, msg.text),
          h('div',{className:'chat-avatar av-user'},'LS')
        );
      }
    }),
    h('div',{ref:chatEndRef})
  );
}

function AiMessage({text, typing, onDone}) {
  const [done, setDone] = useState(false);
  useEffect(()=>{
    if(typing && !done) {
      const t = setTimeout(()=>{setDone(true); onDone();}, 1600);
      return ()=>clearTimeout(t);
    }
  },[typing]);
  useEffect(()=>{ if(!typing) setDone(true); },[]);
  const showTyping = typing && !done;
  return h('div',{className:'chat-row'},
    h('div',{className:'chat-avatar av-ai'},'AI'),
    h('div',{className:'chat-bubble bubble-ai'},
      showTyping
        ? h('div',{className:'typing-dots'},h('div',{className:'dot'}),h('div',{className:'dot'}),h('div',{className:'dot'}))
        : text
    )
  );
}

Schedule: 4 posts / week · 4 weeks · 16 posts total

Generate 3 short-form video scripts with:

— Clear CTA directing to product page`;

  const [savedPrompt, setSavedPrompt] = useState(defaultPrompt);

                      style:{width:'100%',minHeight:164,fontFamily:"'SF Mono',Monaco,Consolas,monospace",fontSize:11,lineHeight:1.7,color:'var(--text-secondary)',border:'1px solid var(--accent-border)',borderRadius:8,padding:'10px 12px',background:'var(--accent-light)',outline:'none',resize:'vertical',boxSizing:'border-box',display:'block'},

// ── App root ──────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('dashboard');
  const [credits, setCredits] = useState(100);
  const [briefingKey, setBriefingKey] = useState(0);
  const [finalCampaign, setFinalCampaign] = useState('summerglow');

  const handleNav = (s, params) => {
    if(s === 'briefing') setBriefingKey(k => k+1);
    if(s === 'finalVersion' && params && params.campaign) setFinalCampaign(params.campaign);
    setScreen(s);
  };
  const handleCredits = (delta) => setCredits(prev => Math.max(0, Math.min(100, prev+delta)));

  const screenMap = {
    dashboard:     h(S1,           {onNav:handleNav}),
    brandIdentity: h(BrandIdentityScreen, {onNav:handleNav}),
    upload:        h(S2,           {onNav:handleNav, onCredits:handleCredits}),
    briefing:      h(S3,           {key:briefingKey, onNav:handleNav, onCredits:handleCredits}),
    loading:       h(S4,           {onNav:handleNav}),
    nodes:         h(S5,           {onNav:handleNav, onCredits:handleCredits}),
    finalVersion:  h(FinalVersionScreen, {onNav:handleNav, onCredits:handleCredits, campaignType:finalCampaign}),
  };

  return h('div',{className:'app'},
    h(Sidebar,{screen, onNav:handleNav, credits}),
    h('div',{className:'main'},
      h(Header,{screen, finalCampaign}),
      screenMap[screen] || screenMap['dashboard']
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
