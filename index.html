<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>basicroute</title>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#121418;
  --surface:#0C0B10;
  --card-shadow:0 2px 16px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.04);
  --surface-2:#1e1e1e;
  --border:#272727;
  --border-subtle:rgba(255,255,255,0.08);
  --text-primary:#f0f0f0;
  --text-secondary:#888;
  --text-muted:#505050;
  --text-dim:#3a3a3a;
  --green:#4ade80;
  --green-bg:rgba(74,222,128,0.1);
  --green-border:rgba(74,222,128,0.2);
  --blue:#4c85f5;
  --blue-bg:rgba(76,133,245,0.12);
  --blue-border:rgba(76,133,245,0.3);
}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--text-primary);height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}

/* ── Topbar ───────────────────────────────────────────────────────────────── */
.topbar{height:52px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:0}
.topbar-logo{display:flex;align-items:center;gap:9px;margin-right:12px}
.topbar-logo-icon{width:28px;height:28px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:7px;display:flex;align-items:center;justify-content:center}
.topbar-logo-text{font-family:'Gabarito',system-ui,sans-serif;font-weight:600;font-size:13px;color:#fff;letter-spacing:-0.3px}
.topbar-crumb{display:flex;align-items:center;gap:6px;font-family:'Gabarito',system-ui,sans-serif;font-size:12px;color:var(--text-secondary)}
.topbar-crumb .sep{color:var(--text-dim);margin:0 1px}
.topbar-right{display:flex;align-items:center}
.topbar-credits{font-family:'Gabarito',system-ui,sans-serif;font-size:11px;color:var(--text-muted)}
.topbar-vdiv{width:1px;height:14px;background:var(--border);margin:0 11px}
.topbar-org{font-family:'Gabarito',system-ui,sans-serif;font-size:12px;color:var(--text-muted);margin-right:10px}
.topbar-avatar{width:27px;height:27px;background:rgba(255,255,255,0.08);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Gabarito',system-ui,sans-serif;font-size:10px;font-weight:600;color:var(--text-secondary)}

/* ── Content area ─────────────────────────────────────────────────────────── */
.content-area{flex:1;overflow-y:auto}
.screen-pad{padding:38px 32px 100px}

/* ── Dock ─────────────────────────────────────────────────────────────────── */
.dock{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);height:54px;width:322px;background:rgba(20,20,20,0.92);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.08);border-radius:99px;display:flex;align-items:center;padding:7px 8px;gap:2px;z-index:100}
.dock-btn{width:40px;height:40px;border-radius:50px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0.5;cursor:pointer;transition:opacity .15s;background:transparent;border:none}
.dock-btn:hover{opacity:0.8}
.dock-btn.active{background:rgba(255,255,255,0.1);opacity:1}
.dock-btn.ghost{cursor:default;pointer-events:none}
.dock-sep{width:1px;height:20px;background:rgba(255,255,255,0.08);margin:0 2px;flex-shrink:0}
.dock-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.dock-tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:rgba(30,30,30,0.96);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:4px 9px;font-family:'Gabarito',system-ui,sans-serif;font-size:11px;color:var(--text-secondary);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;backdrop-filter:blur(4px)}
.dock-wrap:hover .dock-tip{opacity:1}

/* ── Screen transitions ───────────────────────────────────────────────────── */
@keyframes screenIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.screen-enter{animation:screenIn 200ms ease forwards}

/* ── Buttons ──────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;font-family:'Inter',sans-serif;font-weight:500;cursor:pointer;border:none;transition:background .12s,opacity .12s;white-space:nowrap;letter-spacing:-0.01em;font-size:14px}
.btn-white{background:#f0f0f0;color:#2c2c2c;padding:8px 18px;border:1px solid #141414}
.btn-white:hover{background:#ddd}
.btn-dark{background:#2c2c2c;color:#fff;padding:8px 18px;border:1px solid #141414}
.btn-dark:hover{background:#383838}
.btn-ghost{background:transparent;color:var(--text-secondary);padding:7px 13px;border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--text-muted)}
.btn-blue{background:var(--blue);color:#fff;padding:8px 16px}
.btn-blue:hover{opacity:.9}
.btn.lg{padding:10px 22px;font-size:14px}

/* ── Badges ───────────────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500;letter-spacing:-0.15px;font-family:'Inter',sans-serif}
.badge-active{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text-primary)}
.badge-draft{background:var(--surface-2);border:1px solid var(--border);color:var(--text-secondary)}
.badge-completed{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}
.badge-blue{background:var(--blue-bg);border:1px solid var(--blue-border);color:var(--blue)}
.badge-ok{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}

/* ── Dashboard ────────────────────────────────────────────────────────────── */
.campaigns-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.campaign-card{background:var(--surface);border:none;border-radius:12px;overflow:hidden;cursor:pointer;transition:box-shadow .15s;position:relative;box-shadow:var(--card-shadow)}
.campaign-card:hover{box-shadow:0 4px 24px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.07)}
.campaign-card-new{display:flex;align-items:center;justify-content:center;border:1px dashed #dfdfdf;box-shadow:none;background:transparent;min-height:314px}
.campaign-card-new:hover{border-color:rgba(255,255,255,0.5);box-shadow:none}
.campaign-thumbs-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px 20px 0}
.campaign-thumb{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;display:block}
.campaign-info{padding:16px 20px 20px}
.campaign-name-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.campaign-name{font-family:'Gabarito',system-ui,sans-serif;font-size:15px;font-weight:600;color:var(--text-primary);letter-spacing:-0.15px}
.campaign-meta-txt{font-family:'Gabarito',system-ui,sans-serif;font-size:12px;color:var(--text-muted);margin-bottom:6px}
.campaign-arrow{position:absolute;right:20px;bottom:20px;font-size:18px;color:var(--text-dim)}

/* ── Version track ────────────────────────────────────────────────────────── */
.version-track{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.vbadge{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:4px;padding:2px 6px;font-family:'Gabarito',system-ui,sans-serif;font-size:10px;font-weight:600;color:var(--text-muted)}
.vbadge.current{background:rgba(255,255,255,0.12);color:#fff}
.v-arrow{font-size:9px;color:var(--text-dim)}

/* ── Sparkline ────────────────────────────────────────────────────────────── */
.sparkline-row{display:flex;align-items:center;gap:8px}
.mini-sparkline{display:flex;align-items:flex-end;gap:2px;height:22px}
.spark-bar{width:9px;border-radius:2px 2px 0 0;background:var(--green)}
.spark-bar.dim{background:rgba(255,255,255,0.15)}
.spark-bar.dark{background:#373737}
.spark-label{font-family:'Gabarito',system-ui,sans-serif;font-size:11px;font-weight:600;color:var(--green)}

/* ── Upload / New Campaign ────────────────────────────────────────────────── */
.upload-center{display:flex;flex-direction:column;align-items:center;padding:40px 32px 100px}
.upload-h1{font-family:'Gabarito',system-ui,sans-serif;font-size:32px;font-weight:600;color:var(--text-primary);letter-spacing:-0.4px;text-align:center;margin-bottom:6px}
.upload-sub{font-family:'Gabarito',system-ui,sans-serif;font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:24px}
.upload-card{width:446px;background:var(--surface);border:none;border-radius:12px;overflow:hidden;box-shadow:var(--card-shadow)}
.section-hdr{padding:13px 20px 11px;border-bottom:1px solid var(--border);font-family:'Gabarito',system-ui,sans-serif;font-size:15px;font-weight:600;color:var(--text-primary);letter-spacing:-0.15px}
.section-body{padding:16px 20px 20px}
.f-label{font-family:'Gabarito',system-ui,sans-serif;font-size:14px;color:#676767;letter-spacing:-0.15px;margin-bottom:6px}
.f-input{width:100%;background:#272727;border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:10px 11px;font-family:'Gabarito',system-ui,sans-serif;font-size:14px;color:var(--text-primary);outline:none;letter-spacing:-0.15px}
.f-input:focus{border-color:rgba(255,255,255,0.25)}
.brand-row{background:#272727;border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:10px;display:flex;align-items:center;gap:10px}
.brand-check{width:19px;height:19px;background:#3d3d3d;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;gap:2px}
.brand-name{font-family:'Gabarito',system-ui,sans-serif;font-size:14px;color:var(--text-primary);letter-spacing:-0.15px}
.brand-sub{font-family:'Gabarito',system-ui,sans-serif;font-size:12px;color:var(--text-primary);opacity:0.4;letter-spacing:-0.15px}
.dropzone-dark{background:#272727;border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.dropzone-icon{width:28px;height:28px;background:#3d3d3d;border-radius:8px}
.dropzone-text{font-family:'Gabarito',system-ui,sans-serif;font-size:14px;color:var(--text-primary);opacity:0.4;line-height:1.5}

/* ── Brief ────────────────────────────────────────────────────────────────── */
.brief-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card-d{background:var(--surface);border:none;border-radius:12px;overflow:hidden;box-shadow:var(--card-shadow)}
.card-d-hdr{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-d-title{font-family:'Gabarito',sans-serif;font-size:14px;font-weight:600;color:var(--text-primary)}
.card-d-body{padding:16px 20px}
.field-row{margin-bottom:12px}
.field-lbl{font-size:11px;font-weight:500;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;font-family:'Inter',sans-serif}
.field-val{min-height:32px;border-radius:6px;padding:7px 10px;font-size:13px;font-family:'Gabarito',sans-serif;border:1px solid var(--border)}
.field-empty{background:var(--surface-2);color:var(--text-muted)}
.field-filled{background:var(--blue-bg);border-color:var(--blue-border);color:var(--text-primary)}

/* ── Chat ─────────────────────────────────────────────────────────────────── */
.chat-area{display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:380px;padding-right:4px}
.chat-row{display:flex;align-items:flex-end;gap:8px}
.chat-row.user{flex-direction:row-reverse}
.chat-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex-shrink:0;font-family:'Gabarito',sans-serif}
.av-ai{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--border)}
.av-user{background:var(--border);color:var(--text-secondary)}
.chat-bubble{max-width:82%;padding:10px 13px;border-radius:16px;font-size:13px;line-height:1.5;font-family:'Inter',sans-serif}
.bubble-ai{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--border);border-bottom-left-radius:4px}
.bubble-user{background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.bubble-ghost{background:var(--blue-bg);color:var(--text-primary);border:1px dashed var(--blue-border);border-bottom-right-radius:4px;cursor:pointer}
.bubble-ghost:hover{background:rgba(76,133,245,0.2)}
.ghost-hint{font-size:10px;opacity:.6;margin-top:3px}
.typing-dots{display:flex;gap:4px;align-items:center;padding:4px 0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted)}
.dot:nth-child(1){animation:pulse 1s infinite 0s}
.dot:nth-child(2){animation:pulse 1s infinite .2s}
.dot:nth-child(3){animation:pulse 1s infinite .4s}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

/* ── Bottom bar ───────────────────────────────────────────────────────────── */
.bottom-bar{background:var(--surface);border:none;border-radius:12px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;margin-top:20px;box-shadow:var(--card-shadow)}
.bottom-bar-left{font-size:13px;color:var(--text-secondary);font-family:'Gabarito',sans-serif}

/* ── Loading ──────────────────────────────────────────────────────────────── */
.step-row{display:flex;align-items:center;gap:12px;padding:12px 0}
.step-row+.step-row{border-top:1px solid var(--surface-2)}
.step-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .3s}
.step-dot.pending{background:var(--border)}
.step-dot.active{background:var(--blue);animation:pulse 1s ease-in-out infinite}
.step-dot.done{background:var(--green)}
.step-text{font-size:13px;display:flex;align-items:center;gap:6px;font-family:'Gabarito',sans-serif}
.step-text.pending{color:var(--text-muted)}
.step-text.active{color:var(--text-primary);font-weight:500}
.step-text.done{color:var(--text-secondary)}

/* ── Storyboard ───────────────────────────────────────────────────────────── */
.sb-frame{background:var(--surface-2);border:1.5px solid rgba(255,255,255,.08);border-radius:8px;height:68px;display:flex;flex-direction:column;justify-content:space-between;padding:8px 12px;cursor:grab;user-select:none;transition:border-color .15s,opacity .15s}
.sb-frame:active{cursor:grabbing}
.sb-frame.drag-over{border-color:var(--blue);background:rgba(76,133,245,0.08)}
.sb-frame.dragging{opacity:.35}
.sb-frame-num{font-size:10px;font-weight:600;color:rgba(255,255,255,.25);letter-spacing:.06em;font-family:'Inter',sans-serif}
.sb-frame-label{font-size:11px;color:rgba(255,255,255,.55);line-height:1.35;font-family:'Gabarito',sans-serif}

/* ── Campaign result — 4 video cards ────────────────────────────────────── */
.camp-videos-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.camp-video-card{background:var(--surface);border:none;border-radius:12px;overflow:hidden;box-shadow:var(--card-shadow)}
.camp-video-thumb{position:relative;aspect-ratio:16/9;max-height:240px;background:#0c0c12;overflow:hidden;display:flex;align-items:center;justify-content:center}
.camp-video-thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.camp-play-btn{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.3)}
.camp-regen-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.5)}
.camp-spinner{width:28px;height:28px;border:2px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.camp-regen-txt{font-family:'Gabarito',sans-serif;font-size:12px;color:rgba(255,255,255,.55)}
.camp-video-footer{padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.camp-video-label{font-family:'Gabarito',sans-serif;font-size:14px;font-weight:600;color:var(--text-primary)}
.camp-video-actions{display:flex;gap:6px}
.camp-toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 20px;font-family:'Gabarito',sans-serif;font-size:13px;color:var(--text-secondary);white-space:nowrap;z-index:200;animation:screenIn 200ms ease forwards}

/* ── Generation screens (image + video) ─────────────────────────────────── */
.gen2-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding-bottom:60px}
.gen2-heading{text-align:center;margin-bottom:28px}
.gen2-h1{font-family:'Gabarito',sans-serif;font-size:32px;font-weight:600;color:var(--text-primary);letter-spacing:-0.4px;line-height:1.2;margin:0 0 6px}
.gen2-sub{font-family:'Gabarito',sans-serif;font-size:13px;color:var(--text-muted);text-align:center;margin:0}
.gen2-bar{width:728px;max-width:calc(100vw - 120px);background:#272727;border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;cursor:text}
.gen2-bar-text{font-family:'Gabarito',sans-serif;font-size:14px;color:var(--text-primary);letter-spacing:-0.15px}
.gen2-prev{width:728px;max-width:calc(100vw - 120px)}
.gen2-prev-label{font-family:'Gabarito',sans-serif;font-size:14px;color:rgba(255,255,255,0.4);letter-spacing:-0.15px;margin:0 0 12px}
.gen2-gallery{display:flex;gap:36px}
.gen2-item{width:218px;height:218px;border-radius:12px;overflow:hidden;background:#1a1a1a;flex-shrink:0;position:relative}
.gen2-item img{width:100%;height:100%;object-fit:cover;display:block}
.gen2-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.gen2-play-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.18);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,0.3)}

/* ── Brand Identity ───────────────────────────────────────────────────────── */
.bi-screen{flex:1;display:flex;flex-direction:column;overflow:hidden;animation:screenIn 220ms ease forwards}
.bi-header{display:flex;align-items:flex-start;justify-content:space-between;padding:24px 32px 0;flex-shrink:0}
.bi-title{font-family:'Gabarito',system-ui,sans-serif;font-weight:600;font-size:28px;color:var(--text-primary);letter-spacing:-0.4px;line-height:1.2}
.bi-sub{font-size:13px;color:var(--text-muted);margin-top:5px;font-family:'Gabarito',sans-serif}
.bi-panels{display:flex;gap:16px;flex:1;min-height:0;padding:20px 32px 28px}
.bi-panel{border-radius:10px;overflow:hidden;position:relative;background:#141414}
.bi-panel-main{flex:0 0 calc(57.5% - 8px);display:flex;align-items:center;justify-content:center}
.bi-panel-main img{max-width:91%;max-height:94%;object-fit:contain;display:block}
.bi-panel-secondary{flex:1}
.bi-panel-secondary img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* ── Page heading helpers ─────────────────────────────────────────────────── */
.pg-h1{font-family:'Gabarito',system-ui,sans-serif;font-weight:600;font-size:32px;color:var(--text-primary);letter-spacing:-0.4px;line-height:1.2;margin-bottom:4px}
.pg-sub{font-family:'Gabarito',system-ui,sans-serif;font-size:13px;color:var(--text-muted)}

/* ── Campaign Wizard ─────────────────────────────────────────────────────── */
.wz-screen{display:flex;flex-direction:column;height:100%;animation:screenIn 220ms ease forwards}
.wz-chrome{display:flex;align-items:center;padding:16px 32px 0;flex-shrink:0;position:relative;height:48px}
.wz-back{background:none;border:none;color:var(--text-secondary);font-family:'Gabarito',sans-serif;font-size:13px;cursor:pointer;padding:0;display:flex;align-items:center;gap:5px;transition:color .15s}
.wz-back:hover{color:var(--text-primary)}
.wz-step-dots{display:flex;align-items:center;gap:8px;position:absolute;left:50%;transform:translateX(-50%)}
.wz-dot{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Gabarito',sans-serif;font-size:10px;font-weight:600;color:var(--text-muted);flex-shrink:0;transition:all .2s}
.wz-dot.active{background:#fff;border-color:#fff;color:#0C0B10}
.wz-dot.done{background:var(--surface-2);border-color:var(--border);color:var(--green)}
.wz-body{flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:24px 32px 100px}
.wz-form{width:100%;display:flex;flex-direction:column;align-items:center}
.wz-h1{font-family:'Gabarito',sans-serif;font-size:28px;font-weight:600;color:var(--text-primary);letter-spacing:-0.4px;text-align:center;margin:0 0 8px}
.wz-sub{font-family:'Gabarito',sans-serif;font-size:13px;color:var(--text-muted);text-align:center;margin:0 0 28px}
.wz-input{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-family:'Gabarito',sans-serif;font-size:15px;color:var(--text-primary);outline:none;transition:border-color .15s;width:100%}
.wz-input:focus{border-color:rgba(255,255,255,0.25)}
.wz-input::placeholder{color:var(--text-muted)}
.wz-type-cards{display:flex;gap:16px;margin-bottom:20px}
.wz-type-card{width:160px;background:var(--surface);border:1.5px solid transparent;border-radius:12px;padding:20px 16px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s;position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:var(--card-shadow)}
.wz-type-card:hover{box-shadow:0 4px 20px rgba(0,0,0,0.55),0 0 0 1px rgba(255,255,255,0.08)}
.wz-type-card.selected{border-color:var(--blue);background:var(--blue-bg)}
.wz-type-icon{font-size:26px;line-height:1}
.wz-type-label{font-family:'Gabarito',sans-serif;font-size:13px;font-weight:600;color:var(--text-primary)}
.wz-type-desc{font-family:'Gabarito',sans-serif;font-size:11px;color:var(--text-secondary);line-height:1.4}
.wz-type-check{position:absolute;top:10px;right:10px;width:16px;height:16px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.wz-type-card.selected .wz-type-check{opacity:1}
.wz-idk{background:none;border:none;font-family:'Gabarito',sans-serif;font-size:13px;color:var(--text-secondary);cursor:pointer;padding:8px;transition:color .15s}
.wz-idk:hover{color:var(--text-primary)}
.wz-label{font-family:'Gabarito',sans-serif;font-size:13px;color:var(--text-secondary);width:100%;text-align:left;margin-bottom:10px}
.wz-pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.wz-pill{background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:7px 14px;font-family:'Gabarito',sans-serif;font-size:13px;color:var(--text-secondary);cursor:pointer;transition:all .15s}
.wz-pill:hover{border-color:rgba(255,255,255,0.2);color:var(--text-primary)}
.wz-pill.sel{background:var(--blue-bg);border-color:var(--blue-border);color:var(--blue)}
.wz-rec-label{font-family:'Gabarito',sans-serif;font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;text-align:center;margin-bottom:12px}
.wz-rec-card{background:var(--surface);border:none;border-radius:12px;padding:24px;width:100%;text-align:center;margin-bottom:20px;box-shadow:var(--card-shadow)}
.wz-rec-name{font-family:'Gabarito',sans-serif;font-size:22px;font-weight:600;color:var(--text-primary);margin-bottom:8px}
.wz-rec-reason{font-family:'Inter',sans-serif;font-size:13px;color:var(--text-secondary);line-height:1.55;margin:0}
.wz-info{background:var(--blue-bg);border:1px solid var(--blue-border);border-radius:8px;padding:12px 16px;font-family:'Gabarito',sans-serif;font-size:13px;color:var(--blue);text-align:center;margin-bottom:24px;width:100%}
.wz-vibes{display:flex;gap:20px;width:100%;margin-bottom:24px}
.wz-vibe{flex:1;background:var(--surface);border:1.5px solid transparent;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative;box-shadow:var(--card-shadow)}
.wz-vibe.sel{border-color:var(--blue)}
.wz-vibe-check{position:absolute;top:10px;right:10px;width:20px;height:20px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.wz-vibe.sel .wz-vibe-check{opacity:1}
.wz-vibe-img{width:100%;height:160px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:'Gabarito',sans-serif;font-size:12px;color:var(--text-muted);border-bottom:1px solid var(--border)}
.wz-vibe-body{padding:16px}
.wz-vibe-name{font-family:'Gabarito',sans-serif;font-size:15px;font-weight:600;color:var(--text-primary);margin:0 0 8px}
.wz-vibe-desc{font-family:'Gabarito',sans-serif;font-size:12px;color:var(--text-secondary);line-height:1.5;margin:0}
.wz-assets{display:flex;flex-direction:column;gap:10px;width:100%;margin-bottom:24px}
.wz-asset{background:var(--surface);border:1.5px solid transparent;border-radius:10px;padding:16px 20px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s;box-shadow:var(--card-shadow)}
.wz-asset:hover{box-shadow:0 4px 20px rgba(0,0,0,0.55),0 0 0 1px rgba(255,255,255,0.07)}
.wz-asset.sel{border-color:var(--blue);background:var(--blue-bg)}
.wz-asset-hdr{display:flex;align-items:center;gap:10px}
.wz-radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;transition:all .15s;background:transparent}
.wz-asset.sel .wz-radio{border-color:var(--blue);background:var(--blue)}
.wz-asset-lbl{font-family:'Gabarito',sans-serif;font-size:14px;font-weight:600;color:var(--text-primary)}
.wz-asset-sub{font-family:'Gabarito',sans-serif;font-size:12px;color:var(--text-secondary);margin-top:5px;padding-left:26px}
.wz-kit-row{display:flex;gap:6px;align-items:center;margin-top:10px;padding-left:26px;flex-wrap:wrap}
.wz-swatch{width:22px;height:22px;border-radius:50%;flex-shrink:0}
.wz-swatch-lbl{font-family:'Gabarito',sans-serif;font-size:11px;color:var(--text-muted)}
.wz-review{background:var(--surface);border:none;border-radius:12px;padding:24px;width:100%;margin-bottom:20px;box-shadow:var(--card-shadow)}
.wz-rev-section{margin-bottom:20px}
.wz-rev-section:last-child{margin-bottom:0}
.wz-rev-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.wz-rev-title{font-family:'Gabarito',sans-serif;font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em}
.wz-rev-edit{background:none;border:none;font-family:'Gabarito',sans-serif;font-size:11px;color:var(--blue);cursor:pointer;padding:0}
.wz-rev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px}
.wz-rev-field{display:flex;flex-direction:column;gap:2px}
.wz-rev-lbl{font-family:'Gabarito',sans-serif;font-size:11px;color:var(--text-muted)}
.wz-rev-val{font-family:'Gabarito',sans-serif;font-size:13px;color:var(--text-primary)}
.wz-insight{background:rgba(20,20,20,0.8);border:1px solid var(--border);border-radius:8px;padding:16px;font-family:'Inter',sans-serif;font-size:13px;color:var(--text-secondary);line-height:1.55;margin-bottom:24px;width:100%}
.wz-credit-note{font-family:'Gabarito',sans-serif;font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px}

/* ── Wizard new floating layout ──────────────────────────────────────────── */
.wz-outer{padding:36px 32px 120px;overflow-y:auto;height:100%;display:flex;flex-direction:column}
.wz-row{display:flex;align-items:flex-start;gap:20px;margin:0 auto;width:100%;max-width:500px;transition:max-width .5s cubic-bezier(.4,0,.2,1)}
.wz-row.brief-open{max-width:1080px}

.wz-chat-card{width:500px;flex-shrink:0;background:var(--surface);border-radius:16px;box-shadow:0 8px 48px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.07);display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:2;max-height:650px}
.wz-chat-messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px;min-height:160px}

.wz-brief-card{flex:1;background:var(--surface);border-radius:16px;box-shadow:var(--card-shadow);overflow:hidden;opacity:0;transform:translateX(28px);transition:opacity .45s ease,transform .45s ease;pointer-events:none;display:flex;flex-direction:column;max-height:650px}
.wz-brief-card.visible{opacity:1;transform:none;pointer-events:auto}
.wz-brief-body{flex:1;overflow-y:auto;padding:16px 20px}

/* Fake input */
.fake-input-wrap{border-top:1px solid var(--border);padding:10px 14px;flex-shrink:0}
.fake-input{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 13px;cursor:pointer;transition:border-color .15s,background .15s}
.fake-input:hover{border-color:rgba(255,255,255,.16);background:#232323}
.fake-input.active{border-color:rgba(255,255,255,.2);cursor:default;background:#232323}
.fi-avatar{width:24px;height:24px;border-radius:50%;background:#2c2c2c;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--text-secondary);font-family:'Gabarito',sans-serif}
.fi-text{flex:1;min-width:0;font-size:13px;font-family:'Inter',sans-serif;line-height:1.4}
.fi-placeholder{color:var(--text-dim)}
.fi-typed{color:var(--text-primary)}
.fi-hint{font-size:11px;color:var(--text-dim);font-family:'Inter',sans-serif;white-space:nowrap;flex-shrink:0}
.fi-cursor{display:inline-block;width:1.5px;height:12px;background:var(--text-primary);margin-left:1px;animation:blink .55s step-end infinite;vertical-align:middle}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── Reports ─────────────────────────────────────────────────────────────── */
.reports-screen{display:flex;height:100%;overflow:hidden;animation:screenIn 220ms ease forwards}
.reports-sidebar{width:256px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.reports-sidebar-hdr{padding:24px 20px 14px;border-bottom:1px solid var(--border);font-family:'Gabarito',sans-serif;font-size:15px;font-weight:600;color:var(--text-primary);letter-spacing:-0.15px}
.reports-camp-list{flex:1;overflow-y:auto;padding:8px}
.reports-camp-item{padding:11px 14px;border-radius:8px;cursor:pointer;transition:background .12s;margin-bottom:2px}
.reports-camp-item:hover{background:rgba(255,255,255,.04)}
.reports-camp-item.active{background:rgba(255,255,255,.07)}
.reports-camp-name{font-family:'Gabarito',sans-serif;font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:5px;line-height:1.3}
.reports-camp-row{display:flex;align-items:center;gap:8px}
.reports-camp-stat{font-family:'Gabarito',sans-serif;font-size:11px;color:var(--text-muted)}

.reports-content{flex:1;overflow-y:auto;padding:28px 32px 100px}
.report-body{max-width:900px}
.report-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px}
.report-title{font-family:'Gabarito',sans-serif;font-size:22px;font-weight:600;color:var(--text-primary);letter-spacing:-0.3px;margin:0 0 4px}
.report-subtitle{font-family:'Gabarito',sans-serif;font-size:12px;color:var(--text-muted);margin:0}

.report-stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.report-stat-card{background:var(--surface);border-radius:10px;padding:16px 18px;box-shadow:var(--card-shadow)}
.report-stat-value{font-family:'Gabarito',sans-serif;font-size:26px;font-weight:600;color:var(--text-primary);letter-spacing:-0.5px;line-height:1;margin-bottom:5px}
.report-stat-label{font-family:'Gabarito',sans-serif;font-size:11px;color:var(--text-muted)}

.report-chart-wrap{background:var(--surface);border-radius:10px;padding:18px 20px 14px;margin-bottom:24px;box-shadow:var(--card-shadow)}
.report-chart-title{font-family:'Gabarito',sans-serif;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.report-chart{height:72px;display:flex;align-items:flex-end;gap:6px}
.report-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.report-bar{width:100%;background:var(--blue);border-radius:3px 3px 0 0;min-height:3px;opacity:.75;transition:opacity .15s}
.report-bar-col:hover .report-bar{opacity:1}
.report-bar-lbl{font-family:'Gabarito',sans-serif;font-size:9px;color:var(--text-dim);letter-spacing:.02em}

.report-posts-hdr{font-family:'Gabarito',sans-serif;font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:12px;letter-spacing:-0.15px}
.report-table{background:var(--surface);border-radius:10px;overflow:hidden;box-shadow:var(--card-shadow)}
.report-table-head{display:grid;grid-template-columns:1fr 64px 72px 64px 64px 58px;padding:9px 16px;border-bottom:1px solid var(--border)}
.report-table-head .rt-col{font-family:'Gabarito',sans-serif;font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.report-table-row{display:grid;grid-template-columns:1fr 64px 72px 64px 64px 58px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.03);transition:background .1s;align-items:center}
.report-table-row:last-child{border-bottom:none}
.report-table-row:hover{background:rgba(255,255,255,.03)}
.rt-col{font-family:'Gabarito',sans-serif;font-size:13px;color:var(--text-primary)}
.rt-muted{color:var(--text-secondary);font-size:12px}
.rt-ctr{color:var(--green);font-weight:600;font-size:13px}
.rt-col-post{display:flex;align-items:center;gap:10px;min-width:0}
.rt-thumb{width:34px;height:34px;border-radius:5px;background:var(--surface-2);flex-shrink:0;border:1px solid var(--border)}
.rt-post-name{font-size:13px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Gabarito',sans-serif}

.reports-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;padding-bottom:60px}
.reports-empty-icon{width:44px;height:44px;border-radius:10px;background:var(--surface);box-shadow:var(--card-shadow);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.reports-empty p{font-family:'Gabarito',sans-serif;font-size:13px;color:var(--text-muted);text-align:center;line-height:1.5;max-width:220px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const h = React.createElement;
const {useState, useEffect, useRef} = React;

/* ── Inline SVG icons ────────────────────────────────────────────────────── */
const LogoIcon = () => h('svg',{width:16,height:16,viewBox:'0 0 16 16',fill:'none'},
  h('rect',{x:1,y:1,width:6,height:6,rx:1.5,fill:'rgba(255,255,255,0.7)'}),
  h('rect',{x:9,y:1,width:6,height:6,rx:1.5,fill:'rgba(255,255,255,0.7)'}),
  h('rect',{x:1,y:9,width:6,height:6,rx:1.5,fill:'rgba(255,255,255,0.7)'}),
  h('rect',{x:9,y:9,width:6,height:6,rx:1.5,fill:'rgba(255,255,255,0.7)'})
);

const DockGrid = () => h('svg',{width:18,height:18,viewBox:'0 0 18 18',fill:'none'},
  h('rect',{x:1,y:1,width:7,height:7,rx:1.5,fill:'white'}),
  h('rect',{x:10,y:1,width:7,height:7,rx:1.5,fill:'white'}),
  h('rect',{x:1,y:10,width:7,height:7,rx:1.5,fill:'white'}),
  h('rect',{x:10,y:10,width:7,height:7,rx:1.5,fill:'white'})
);

const DockCircle = () => h('svg',{width:18,height:18,viewBox:'0 0 18 18',fill:'none'},
  h('circle',{cx:9,cy:9,r:6.5,stroke:'white',strokeWidth:1.5})
);

const DockBox = () => h('svg',{width:18,height:18,viewBox:'0 0 18 18',fill:'none'},
  h('rect',{x:2,y:2,width:10,height:10,rx:2,stroke:'white',strokeWidth:1.5}),
  h('path',{d:'M10 8h5.5M13 5.5l2.5 2.5L13 10.5',stroke:'white',strokeWidth:1.5,strokeLinecap:'round',strokeLinejoin:'round'})
);

const DockChart = () => h('svg',{width:18,height:18,viewBox:'0 0 18 18',fill:'none'},
  h('rect',{x:2,y:9,width:3,height:7,rx:1,fill:'white'}),
  h('rect',{x:7,y:5,width:3,height:11,rx:1,fill:'white'}),
  h('rect',{x:12,y:2,width:3,height:14,rx:1,fill:'white'})
);

const DockPlay = () => h('svg',{width:18,height:18,viewBox:'0 0 18 18',fill:'none'},
  h('path',{d:'M4.5 3.5l10 5.5-10 5.5V3.5z',stroke:'white',strokeWidth:1.5,strokeLinejoin:'round'})
);

const DockCode = () => h('svg',{width:18,height:18,viewBox:'0 0 18 18',fill:'none'},
  h('path',{d:'M6 5l-4 4 4 4M12 5l4 4-4 4',stroke:'white',strokeWidth:1.5,strokeLinecap:'round',strokeLinejoin:'round'})
);

const DockGear = () => h('svg',{width:18,height:18,viewBox:'0 0 18 18',fill:'none'},
  h('circle',{cx:9,cy:9,r:2.5,stroke:'white',strokeWidth:1.5}),
  h('path',{d:'M9 2.5V4M9 14v1.5M2.5 9H4M14 9h1.5M4.4 4.4l1.1 1.1M12.5 12.5l1.1 1.1M12.5 5.5l1.1-1.1M4.4 13.6l1.1-1.1',stroke:'white',strokeWidth:1.5,strokeLinecap:'round'})
);

const CheckMini = () => h('svg',{width:11,height:11,viewBox:'0 0 12 12',fill:'none'},
  h('polyline',{points:'2 6 5 9 10 3',stroke:'white',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'})
);

const GreenCheck = () => h('svg',{width:12,height:12,viewBox:'0 0 12 12',fill:'none'},
  h('polyline',{points:'2 6 5 9 10 3',stroke:'#4ade80',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'})
);

const CalIcon = () => h('svg',{width:28,height:28,viewBox:'0 0 24 24',fill:'none',stroke:'var(--blue)',strokeWidth:1.5,strokeLinecap:'round',strokeLinejoin:'round'},
  h('rect',{x:3,y:4,width:18,height:18,rx:2}),h('line',{x1:16,y1:2,x2:16,y2:6}),
  h('line',{x1:8,y1:2,x2:8,y2:6}),h('line',{x1:3,y1:10,x2:21,y2:10})
);

/* ── Topbar ───────────────────────────────────────────────────────────────── */
function Topbar({screen, credits}) {
  const raw = Math.round(credits * 8.4);
  const crumbMap = {
    dashboard:    ['Projects'],
    brandIdentity:['Brand Identity'],
    upload:       ['Projects', 'New campaign'],
    loading:      ['Projects', 'Summer Glow — Q3', 'Building storyboard'],
    storyboard:      ['Projects', 'Summer Glow — Q3', 'Storyboard'],
    generated:       ['Projects', 'Summer Glow — Q3', 'Video Generation'],
    imageGeneration: ['Image Generation'],
    settings:        ['Settings'],
    reports:         ['Reports'],
  };
  const crumbs = crumbMap[screen] || ['Projects'];
  return h('div',{className:'topbar'},
    h('div',{className:'topbar-left'},
      h('div',{className:'topbar-logo'},
        h('div',{className:'topbar-logo-icon'}, h(LogoIcon)),
        h('span',{className:'topbar-logo-text'},'basicroute')
      ),
      h('div',{className:'topbar-crumb'},
        crumbs.map((c,i) => h(React.Fragment,{key:i},
          i > 0 && h('span',{className:'sep'},' / '),
          h('span',null, c)
        ))
      )
    ),
    h('div',{className:'topbar-right'},
      h('span',{className:'topbar-credits'}, `${raw} credits`),
      h('div',{className:'topbar-vdiv'}),
      h('span',{className:'topbar-org'},'Lumeo Skincare'),
      h('div',{className:'topbar-avatar'},'LS')
    )
  );
}

/* ── Dock ─────────────────────────────────────────────────────────────────── */
function Dock({screen, onNav}) {
  return h('div',{className:'dock'},
    h('div',{className:'dock-wrap'},
      h('button',{className:`dock-btn${screen==='dashboard'?' active':''}`,onClick:()=>onNav('dashboard')}, h(DockGrid)),
      h('span',{className:'dock-tip'},'Projects')
    ),
    h('div',{className:'dock-wrap'},
      h('button',{className:`dock-btn${screen==='brandIdentity'?' active':''}`,onClick:()=>onNav('brandIdentity')}, h(DockCircle)),
      h('span',{className:'dock-tip'},'Brand Identity')
    ),
    h('div',{className:'dock-wrap'},
      h('button',{className:`dock-btn${screen==='reports'?' active':''}`,onClick:()=>onNav('reports')}, h(DockChart)),
      h('span',{className:'dock-tip'},'Reports')
    ),
    h('div',{className:'dock-sep'}),
    h('div',{className:'dock-wrap'},
      h('button',{className:`dock-btn${screen==='imageGeneration'?' active':''}`,onClick:()=>onNav('imageGeneration')}, h(DockBox)),
      h('span',{className:'dock-tip'},'Image Generation')
    ),
    h('div',{className:'dock-wrap'},
      h('button',{className:`dock-btn${screen==='generated'?' active':''}`,onClick:()=>onNav('generated')}, h(DockPlay)),
      h('span',{className:'dock-tip'},'Video Generation')
    ),
    h('div',{className:'dock-wrap'},
      h('button',{className:'dock-btn ghost'}, h(DockCode)),
      h('span',{className:'dock-tip'},'Code')
    ),
    h('div',{className:'dock-wrap'},
      h('button',{className:`dock-btn${screen==='settings'?' active':''}`,onClick:()=>onNav('settings')}, h(DockGear)),
      h('span',{className:'dock-tip'},'Settings')
    )

function FakeInput({text, onSend}) {
  const [displayed, setDisplayed] = useState('');
  const [typing, setTyping] = useState(false);
  const [done, setDone] = useState(false);

  const handleClick = () => {
    if (typing || done) return;
    setTyping(true);
    let i = 0;
    const next = () => {
      if (i >= text.length) {
        setTyping(false);
        setDone(true);
        setTimeout(onSend, 320);
        return;
      }
      setDisplayed(text.slice(0, ++i));
      setTimeout(next, 22 + Math.random() * 22);
    };
    next();
  };

  return h('div',{className:'fake-input-wrap'},
    h('div',{className:`fake-input${typing||done?' active':''}`,onClick:handleClick},
      h('div',{className:'fi-avatar'},'LS'),
      h('div',{className:'fi-text'},
        done||typing
          ? h('span',{className:'fi-typed'}, displayed, typing&&h('span',{className:'fi-cursor'}))
          : h('span',{className:'fi-placeholder'}, text)
      ),
      !typing&&!done && h('div',{className:'fi-hint'},'click to reply')
    )
  );
}

function CampaignWizard({onNav, onCredits}) {
  const [chatStep, setChatStep] = useState(0);
  const [brief, setBrief] = useState({});
  const chatEndRef = useRef(null);
  const N = WIZARD_EXCHANGES.length;

  const showBrief = chatStep >= 6;

  useEffect(()=>{ if(chatEndRef.current) chatEndRef.current.scrollIntoView({behavior:'smooth'}); },[chatStep]);

  const handleSend = (idx) => {
    const fields = WIZARD_EXCHANGES[idx].fields;
    if (Object.keys(fields).length > 0) {
      setBrief(prev=>({...prev,...fields}));
      onCredits(-4);
    }
    setChatStep((idx+1)*2);
  };

  const buildMessages = () => {
    const msgs=[];
    for(let i=0;i<N;i++){
      if(chatStep>=i*2)  msgs.push({type:'ai',text:WIZARD_EXCHANGES[i].ai,typing:chatStep===i*2,key:`ai${i}`});
      if(chatStep>i*2+1) msgs.push({type:'user',text:WIZARD_EXCHANGES[i].user,key:`user${i}`});
    }
    if(chatStep===N*2)  msgs.push({type:'ai',text:WIZARD_FINAL_AI,typing:true, key:'ai-final'});
    if(chatStep>=N*2+1) msgs.push({type:'ai',text:WIZARD_FINAL_AI,typing:false,key:'ai-final'});
    return msgs;
  };

  const isWaiting = chatStep%2===1 && chatStep<N*2;
  const pendingIdx = isWaiting ? (chatStep-1)/2 : -1;
  const allDone = chatStep>=N*2+1;

  const chatCard = h('div',{className:'wz-chat-card'},
    h('div',{className:'card-d-hdr'},
      h('span',{className:'card-d-title'},'AI assistant'),
      h('span',{className:'badge badge-blue'},'✦ Active')
    ),
    h('div',{className:'wz-chat-messages'},
      buildMessages().map(msg =>
        msg.type==='ai'
          ? h(AiMessage,{
              key:msg.key,text:msg.text,typing:msg.typing,
              onDone:()=>{
                const idx = msg.key==='ai-final' ? N : parseInt(msg.key.replace('ai',''));
                if(idx<N) setChatStep(idx*2+1); else setChatStep(N*2+1);
              }
            })
          : h('div',{key:msg.key,className:'chat-row user'},
              h('div',{className:'chat-bubble bubble-user'},msg.text),
              h('div',{className:'chat-avatar av-user'},'LS')
            )
      ),
      h('div',{ref:chatEndRef})
    ),
    isWaiting && h(FakeInput,{
      key:`fi-${pendingIdx}`,
      text:WIZARD_EXCHANGES[pendingIdx].user,
      onSend:()=>handleSend(pendingIdx)
    })
  );

  const briefCard = h('div',{className:`wz-brief-card${showBrief?' visible':''}`},
    h('div',{className:'card-d-hdr'},
      h('span',{className:'card-d-title'},'Campaign brief'),
      allDone && h('span',{className:'badge badge-ok'},'Complete ✓')
    ),
    h('div',{className:'wz-brief-body'},
      WZ_BRIEF_FIELDS.map(f=>h('div',{className:'field-row',key:f.key},
        h('div',{className:'field-lbl'},f.label),
        h('div',{className:`field-val ${brief[f.key]?'field-filled':'field-empty'}`},
          brief[f.key]||'—'
        )
      ))
    )
  );

  return h('div',{className:'wz-outer screen-enter'},
    h('div',{className:`wz-row${showBrief?' brief-open':''}`},
      chatCard,
      briefCard
    ),
    allDone && h('div',{
      className:'bottom-bar',
      style:{width:'100%',maxWidth:showBrief?1080:500,margin:'20px auto 0'}
    },
      h('div',null,
        h('div',{style:{fontWeight:600,fontSize:14,color:'var(--text-primary)',marginBottom:3,fontFamily:"'Gabarito',sans-serif"}},'Brief looks good?'),
        h('div',{style:{fontSize:12,color:'var(--text-muted)',fontFamily:"'Gabarito',sans-serif"}},'Approving will start content generation.')
      ),
      h('button',{className:'btn btn-white lg',onClick:()=>{onCredits(-18);onNav('loading');}},
        'Approve & generate →'
      )
    )
  );
}

function ChatThread({messages, onGhostClick, onTypingDone, chatEndRef, finalIdx=5}) {
  return h('div',{className:'chat-area'},
    messages.map(msg => {
      if(msg.type === 'ai') {
        return h(AiMessage,{key:msg.key,text:msg.text,typing:msg.typing,
          onDone:()=>{
            const idx = msg.key === 'ai-final' ? finalIdx : parseInt(msg.key.replace('ai',''));
            onTypingDone(idx);
          }
        });
      } else if(msg.ghost) {
        return h('div',{key:msg.key,className:'chat-row user'},
          h('div',{className:'chat-bubble bubble-ghost',onClick:()=>onGhostClick(msg.idx)},
            h('div',null,msg.text),
            h('div',{className:'ghost-hint'},'· tap to reply')
          ),
          h('div',{className:'chat-avatar av-user'},'LS')
        );
      } else {
        return h('div',{key:msg.key,className:'chat-row user'},
          h('div',{className:'chat-bubble bubble-user'},msg.text),
          h('div',{className:'chat-avatar av-user'},'LS')
        );
      }
    }),
    h('div',{ref:chatEndRef})
  );
}

function AiMessage({text, typing, onDone}) {
  const [done, setDone] = useState(false);
  useEffect(()=>{
    if(typing && !done) {
      const t = setTimeout(()=>{ setDone(true); onDone(); }, 1600);
      return ()=>clearTimeout(t);
    }
  },[typing]);
  useEffect(()=>{ if(!typing) setDone(true); },[]);
  const showTyping = typing && !done;
  return h('div',{className:'chat-row'},
    h('div',{className:'chat-avatar av-ai'},'AI'),
    h('div',{className:'chat-bubble bubble-ai'},
      showTyping
        ? h('div',{className:'typing-dots'},h('div',{className:'dot'}),h('div',{className:'dot'}),h('div',{className:'dot'}))
        : text
    )
  );
}

function StoryboardScreen({onNav}) {
  const SCENE_LABELS = [
    'Product reveal','Close-up texture','Lifestyle moment','Before & after',
    'Ingredient spotlight','Morning routine','Application technique','Glow result',
    'Testimonial hook','Brand logo close','CTA overlay','End card'
  ];
  const makeFrames = () => SCENE_LABELS.map((label,i) => ({id:i,num:i+1,label}));
  const [activePost, setActivePost] = useState(0);
  const [frames, setFrames] = useState([makeFrames(),makeFrames(),makeFrames(),makeFrames()]);
  const [dragIdx, setDragIdx] = useState(null);
  const [dragOver, setDragOver] = useState(null);

  const handleDrop = (i) => {
    if(dragIdx === null || dragIdx === i){ setDragIdx(null); setDragOver(null); return; }
    setFrames(prev => prev.map((arr,pi) => {
      if(pi !== activePost) return arr;
      const copy = [...arr];
      const [item] = copy.splice(dragIdx,1);
      copy.splice(i,0,item);
      return copy;
    }));
    setDragIdx(null); setDragOver(null);
  };

  return h('div',{className:'screen-pad screen-enter'},
    h('div',{style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24}},
      h('div',null,
        h('h1',{className:'pg-h1'},'Storyboard'),
        h('p',{className:'pg-sub'},'Summer Glow — Q3 · 4 videos · Drag frames to reorder scenes.')
      )
    ),
    h('div',{style:{display:'flex',gap:4,marginBottom:20,borderBottom:'1px solid var(--border)'}},
      ['Video 1','Video 2','Video 3','Video 4'].map((label,i) =>
        h('div',{key:i,style:{
          padding:'10px 18px',fontSize:13,fontWeight:500,cursor:'pointer',userSelect:'none',
          fontFamily:"'Gabarito',sans-serif",
          color:activePost===i?'var(--text-primary)':'var(--text-muted)',
          borderBottom:activePost===i?'2px solid var(--text-primary)':'2px solid transparent',
          marginBottom:'-1px',transition:'color .12s,border-color .12s'
        }, onClick:()=>setActivePost(i)}, label)
      )
    ),
    h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:24}},
      frames[activePost].map((frame,i) =>
        h('div',{key:frame.id, draggable:true,
          onDragStart:()=>setDragIdx(i),
          onDragOver:e=>{ e.preventDefault(); setDragOver(i); },
          onDrop:()=>handleDrop(i),
          onDragEnd:()=>{ setDragIdx(null); setDragOver(null); },
          className:'sb-frame'+(dragIdx===i?' dragging':'')+(dragOver===i&&dragIdx!==i?' drag-over':''),
        },
          h('div',{className:'sb-frame-num'},`SCENE ${frame.num}`),
          h('div',{className:'sb-frame-label'},frame.label)
        )
      )
    ),
    h('div',{className:'bottom-bar'},
      h('span',{className:'bottom-bar-left'},'Happy with the scene order? Generate all 4 videos.'),
      h('button',{className:'btn btn-white lg',onClick:()=>onNav('generated')},'Generate Videos →')
    )

function CampaignReport({campaign}) {
  const s = campaign.summary;
  const stats = [
    {label:'Total views',      value:s.views},
    {label:'Avg engagement',   value:s.engagement},
    {label:'Avg CTR',          value:s.ctr},
    {label:'Posts published',  value:s.posts},
  ];
  const maxBar = Math.max(...campaign.posts.map(p=>p.bar));

  return h('div',{className:'report-body'},
    h('div',{className:'report-header'},
      h('div',null,
        h('h2',{className:'report-title'},campaign.name),
        h('p',{className:'report-subtitle'},campaign.meta)
      ),
      h('span',{className:`badge ${campaign.badge}`},campaign.status)
    ),
    h('div',{className:'report-stats-grid'},
      stats.map(st=>h('div',{key:st.label,className:'report-stat-card'},
        h('div',{className:'report-stat-value'},st.value),
        h('div',{className:'report-stat-label'},st.label)
      ))
    ),
    h('div',{className:'report-chart-wrap'},
      h('div',{className:'report-chart-title'},'Views per post'),
      h('div',{className:'report-chart'},
        campaign.posts.map((p,i)=>h('div',{key:i,className:'report-bar-col'},
          h('div',{className:'report-bar',style:{height:`${Math.round((p.bar/maxBar)*100)}%`}}),
          h('div',{className:'report-bar-lbl'},`P${i+1}`)
        ))
      )
    ),
    h('div',{className:'report-posts-hdr'},'Post performance'),
    h('div',{className:'report-table'},
      h('div',{className:'report-table-head'},
        h('div',{className:'rt-col rt-col-post'},'Post'),
        h('div',{className:'rt-col'},'Date'),
        h('div',{className:'rt-col'},'Views'),
        h('div',{className:'rt-col'},'Likes'),
        h('div',{className:'rt-col'},'Shares'),
        h('div',{className:'rt-col'},'CTR')
      ),
      campaign.posts.map((p,i)=>h('div',{key:i,className:'report-table-row'},
        h('div',{className:'rt-col rt-col-post'},
          h('div',{className:'rt-thumb'}),
          h('span',{className:'rt-post-name'},p.label)
        ),
        h('div',{className:'rt-col rt-muted'},p.date),
        h('div',{className:'rt-col'},p.views),
        h('div',{className:'rt-col'},p.likes),
        h('div',{className:'rt-col'},p.shares),
        h('div',{className:'rt-col rt-ctr'},p.ctr)
      ))
    )
  );
}

function GeneratedScreen() {
  const videos = [
    {label:'Video 1',img:'assets/video-1.png'},
    {label:'Video 2',img:'assets/video-2.png'},
    {label:'Video 3',img:'assets/video-3.png'},
    {label:'Video 4',img:'assets/video-1.png'},
  ];
  const [saved,    setSaved]    = useState([false,false,false,false]);
  const [regenning,setRegenning]= useState([false,false,false,false]);
  const [toast,    setToast]    = useState(false);

  const handleSave = (i) => {
    setSaved(prev => prev.map((v,j)=>j===i?true:v));
    setToast(true);
    setTimeout(()=>setToast(false), 3000);
  };
  const handleRegen = (i) => {
    setRegenning(prev=>prev.map((v,j)=>j===i?true:v));
    setTimeout(()=>setRegenning(prev=>prev.map((v,j)=>j===i?false:v)), 2000);
  };

  const DownloadIcon = () => h('svg',{width:12,height:12,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},
    h('path',{d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'}),
    h('polyline',{points:'7 10 12 15 17 10'}),
    h('line',{x1:'12',y1:'15',x2:'12',y2:'3'})
  );

  return h('div',{className:'screen-pad screen-enter'},
    h('div',{style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:28}},
      h('div',null,
        h('h1',{className:'pg-h1'},'Your videos are ready.'),
        h('p',{className:'pg-sub'},'Summer Glow — Q3 · 4 videos ready')
      )
    ),
    h('div',{className:'camp-videos-grid'},
      videos.map((v,i)=>
        h('div',{key:i,className:'camp-video-card'},
          h('div',{className:'camp-video-thumb'},
            regenning[i]
              ? h('div',{className:'camp-regen-overlay'},
                  h('div',{className:'camp-spinner'}),
                  h('p',{className:'camp-regen-txt'},'Regenerating...')
                )
              : h(React.Fragment,null,
                  h('img',{src:v.img,alt:v.label}),
                  h('div',{className:'camp-play-btn'},
                    h('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'white'},h('path',{d:'M8 5v14l11-7z'}))
                  )
                )
          ),
          h('div',{className:'camp-video-footer'},
            h('span',{className:'camp-video-label'},v.label),
            h('div',{className:'camp-video-actions'},
              h('button',{className:'btn btn-ghost',style:{fontSize:12,padding:'5px 11px',gap:5}},
                h(DownloadIcon), 'Download'
              ),
              saved[i]
                ? h('button',{className:'btn btn-ghost',style:{fontSize:12,padding:'5px 11px',color:'var(--green)',borderColor:'var(--green-border)',gap:5}},'✓ Saved')
                : h('button',{className:'btn btn-ghost',style:{fontSize:12,padding:'5px 11px',gap:5},onClick:()=>handleSave(i)},
                    '✦ Save'
                  ),
              h('button',{className:'btn btn-ghost',style:{fontSize:12,padding:'5px 11px'},onClick:()=>handleRegen(i)},
                '↻ Regen'
              )
            )
          )
        )
      )
    ),
    toast && h('div',{className:'camp-toast'},'Saved to your generations. Videos not saved are deleted after 24 hours.')
  );
}

/* ── App ──────────────────────────────────────────────────────────────────── */
function App() {
  const [screen, setScreen] = useState('dashboard');
  const [credits, setCredits] = useState(100);

  const handleNav = (s) => { setScreen(s); };
  const handleCredits = (delta) => setCredits(prev => Math.max(0, Math.min(100, prev+delta)));

  const screenMap = {
    dashboard:       h(S1,                  {onNav:handleNav}),
    brandIdentity:   h(BrandIdentityScreen, {onNav:handleNav}),
    upload:          h(CampaignWizard,      {onNav:handleNav, onCredits:handleCredits}),
    loading:         h(S4,                  {onNav:handleNav}),
    storyboard:      h(StoryboardScreen,    {onNav:handleNav}),
    generated:       h(GeneratedScreen,     {onNav:handleNav}),
    imageGeneration: h(ImageGenerationScreen,{onNav:handleNav}),
    settings:        h(SettingsScreen,        {onNav:handleNav}),
    reports:         h(ReportsScreen,         {onNav:handleNav}),
  };

  return h('div',{className:'app'},
    h(Topbar,{screen, credits}),
    h('div',{className:'content-area'},
      screenMap[screen] || screenMap['dashboard']
    ),
    h(Dock,{screen, onNav:handleNav})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
