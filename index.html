<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>basicroute</title>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;
  --surface:#141414;
  --surface-2:#1e1e1e;
  --border:#272727;
  --border-subtle:rgba(255,255,255,0.08);
  --text-primary:#f0f0f0;
  --text-secondary:#888;
  --text-muted:#505050;
  --text-dim:#3a3a3a;
  --green:#4ade80;
  --green-bg:rgba(74,222,128,0.1);
  --green-border:rgba(74,222,128,0.2);
  --blue:#4c85f5;
  --blue-bg:rgba(76,133,245,0.12);
  --blue-border:rgba(76,133,245,0.3);
}
body{font-family:'Inter',system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--text-primary);height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}

/* ── Topbar ───────────────────────────────────────────────────────────────── */
.topbar{height:52px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:0}
.topbar-logo{display:flex;align-items:center;gap:9px;margin-right:12px}
.topbar-logo-icon{width:28px;height:28px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:7px;display:flex;align-items:center;justify-content:center}
.topbar-logo-text{font-family:'Gabarito',system-ui,sans-serif;font-weight:600;font-size:13px;color:#fff;letter-spacing:-0.3px}
.topbar-crumb{display:flex;align-items:center;gap:6px;font-family:'Gabarito',system-ui,sans-serif;font-size:12px;color:var(--text-secondary)}
.topbar-crumb .sep{color:var(--text-dim);margin:0 1px}
.topbar-right{display:flex;align-items:center}
.topbar-credits{font-family:'Gabarito',system-ui,sans-serif;font-size:11px;color:var(--text-muted)}
.topbar-vdiv{width:1px;height:14px;background:var(--border);margin:0 11px}
.topbar-org{font-family:'Gabarito',system-ui,sans-serif;font-size:12px;color:var(--text-muted);margin-right:10px}
.topbar-avatar{width:27px;height:27px;background:rgba(255,255,255,0.08);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Gabarito',system-ui,sans-serif;font-size:10px;font-weight:600;color:var(--text-secondary)}

/* ── Content area ─────────────────────────────────────────────────────────── */
.content-area{flex:1;overflow-y:auto}
.screen-pad{padding:38px 32px 100px}

/* ── Dock ─────────────────────────────────────────────────────────────────── */
.dock{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);height:54px;width:279px;background:rgba(20,20,20,0.92);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.08);border-radius:99px;display:flex;align-items:center;padding:7px 8px;gap:2px;z-index:100}
.dock-btn{width:40px;height:40px;border-radius:50px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0.5;cursor:pointer;transition:opacity .15s;background:transparent;border:none}
.dock-btn:hover{opacity:0.8}
.dock-btn.active{background:rgba(255,255,255,0.1);opacity:1}
.dock-btn.ghost{cursor:default;pointer-events:none}
.dock-sep{width:1px;height:20px;background:rgba(255,255,255,0.08);margin:0 2px;flex-shrink:0}

/* ── Screen transitions ───────────────────────────────────────────────────── */
@keyframes screenIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.screen-enter{animation:screenIn 200ms ease forwards}

/* ── Buttons ──────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;font-family:'Inter',sans-serif;font-weight:500;cursor:pointer;border:none;transition:background .12s,opacity .12s;white-space:nowrap;letter-spacing:-0.01em;font-size:14px}
.btn-white{background:#f0f0f0;color:#2c2c2c;padding:8px 18px;border:1px solid #141414}
.btn-white:hover{background:#ddd}
.btn-dark{background:#2c2c2c;color:#fff;padding:8px 18px;border:1px solid #141414}
.btn-dark:hover{background:#383838}
.btn-ghost{background:transparent;color:var(--text-secondary);padding:7px 13px;border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--text-muted)}
.btn-blue{background:var(--blue);color:#fff;padding:8px 16px}
.btn-blue:hover{opacity:.9}
.btn.lg{padding:10px 22px;font-size:14px}

/* ── Badges ───────────────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500;letter-spacing:-0.15px;font-family:'Inter',sans-serif}
.badge-active{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text-primary)}
.badge-draft{background:var(--surface-2);border:1px solid var(--border);color:var(--text-secondary)}
.badge-completed{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}
.badge-blue{background:var(--blue-bg);border:1px solid var(--blue-border);color:var(--blue)}
.badge-ok{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green)}

/* ── Dashboard ────────────────────────────────────────────────────────────── */
.campaigns-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.campaign-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s;position:relative}
.campaign-card:hover{border-color:rgba(255,255,255,0.18)}
.campaign-card-new{display:flex;align-items:center;justify-content:center;border-style:dashed;border-color:#dfdfdf;min-height:314px}
.campaign-card-new:hover{border-color:rgba(255,255,255,0.5)}
.campaign-thumbs-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px 20px 0}
.campaign-thumb{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover;display:block}
.campaign-info{padding:16px 20px 20px}
.campaign-name-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.campaign-name{font-family:'Gabarito',system-ui,sans-serif;font-size:15px;font-weight:600;color:var(--text-primary);letter-spacing:-0.15px}
.campaign-meta-txt{font-family:'Gabarito',system-ui,sans-serif;font-size:12px;color:var(--text-muted);margin-bottom:6px}
.campaign-arrow{position:absolute;right:20px;bottom:20px;font-size:18px;color:var(--text-dim)}

/* ── Version track ────────────────────────────────────────────────────────── */
.version-track{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.vbadge{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:4px;padding:2px 6px;font-family:'Gabarito',system-ui,sans-serif;font-size:10px;font-weight:600;color:var(--text-muted)}
.vbadge.current{background:rgba(255,255,255,0.12);color:#fff}
.v-arrow{font-size:9px;color:var(--text-dim)}

/* ── Sparkline ────────────────────────────────────────────────────────────── */
.sparkline-row{display:flex;align-items:center;gap:8px}
.mini-sparkline{display:flex;align-items:flex-end;gap:2px;height:22px}
.spark-bar{width:9px;border-radius:2px 2px 0 0;background:var(--green)}
.spark-bar.dim{background:rgba(255,255,255,0.15)}
.spark-bar.dark{background:#373737}
.spark-label{font-family:'Gabarito',system-ui,sans-serif;font-size:11px;font-weight:600;color:var(--green)}

/* ── Upload / New Campaign ────────────────────────────────────────────────── */
.upload-center{display:flex;flex-direction:column;align-items:center;padding:40px 32px 100px}
.upload-h1{font-family:'Gabarito',system-ui,sans-serif;font-size:32px;font-weight:600;color:var(--text-primary);letter-spacing:-0.4px;text-align:center;margin-bottom:6px}
.upload-sub{font-family:'Gabarito',system-ui,sans-serif;font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:24px}
.upload-card{width:446px;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.section-hdr{padding:13px 20px 11px;border-bottom:1px solid var(--border);font-family:'Gabarito',system-ui,sans-serif;font-size:15px;font-weight:600;color:var(--text-primary);letter-spacing:-0.15px}
.section-body{padding:16px 20px 20px}
.f-label{font-family:'Gabarito',system-ui,sans-serif;font-size:14px;color:#676767;letter-spacing:-0.15px;margin-bottom:6px}
.f-input{width:100%;background:#272727;border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:10px 11px;font-family:'Gabarito',system-ui,sans-serif;font-size:14px;color:var(--text-primary);outline:none;letter-spacing:-0.15px}
.f-input:focus{border-color:rgba(255,255,255,0.25)}
.brand-row{background:#272727;border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:10px;display:flex;align-items:center;gap:10px}
.brand-check{width:19px;height:19px;background:#3d3d3d;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;gap:2px}
.brand-name{font-family:'Gabarito',system-ui,sans-serif;font-size:14px;color:var(--text-primary);letter-spacing:-0.15px}
.brand-sub{font-family:'Gabarito',system-ui,sans-serif;font-size:12px;color:var(--text-primary);opacity:0.4;letter-spacing:-0.15px}
.dropzone-dark{background:#272727;border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.dropzone-icon{width:28px;height:28px;background:#3d3d3d;border-radius:8px}
.dropzone-text{font-family:'Gabarito',system-ui,sans-serif;font-size:14px;color:var(--text-primary);opacity:0.4;line-height:1.5}

/* ── Brief ────────────────────────────────────────────────────────────────── */
.brief-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card-d{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.card-d-hdr{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-d-title{font-family:'Gabarito',sans-serif;font-size:14px;font-weight:600;color:var(--text-primary)}
.card-d-body{padding:16px 20px}
.field-row{margin-bottom:12px}
.field-lbl{font-size:11px;font-weight:500;color:var(--text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;font-family:'Inter',sans-serif}
.field-val{min-height:32px;border-radius:6px;padding:7px 10px;font-size:13px;font-family:'Gabarito',sans-serif;border:1px solid var(--border)}
.field-empty{background:var(--surface-2);color:var(--text-muted)}
.field-filled{background:var(--blue-bg);border-color:var(--blue-border);color:var(--text-primary)}

/* ── Chat ─────────────────────────────────────────────────────────────────── */
.chat-area{display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:380px;padding-right:4px}
.chat-row{display:flex;align-items:flex-end;gap:8px}
.chat-row.user{flex-direction:row-reverse}
.chat-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;flex-shrink:0;font-family:'Gabarito',sans-serif}
.av-ai{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--border)}
.av-user{background:var(--border);color:var(--text-secondary)}
.chat-bubble{max-width:82%;padding:10px 13px;border-radius:16px;font-size:13px;line-height:1.5;font-family:'Inter',sans-serif}
.bubble-ai{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--border);border-bottom-left-radius:4px}
.bubble-user{background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.bubble-ghost{background:var(--blue-bg);color:var(--text-primary);border:1px dashed var(--blue-border);border-bottom-right-radius:4px;cursor:pointer}
.bubble-ghost:hover{background:rgba(76,133,245,0.2)}
.ghost-hint{font-size:10px;opacity:.6;margin-top:3px}
.typing-dots{display:flex;gap:4px;align-items:center;padding:4px 0}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted)}
.dot:nth-child(1){animation:pulse 1s infinite 0s}
.dot:nth-child(2){animation:pulse 1s infinite .2s}
.dot:nth-child(3){animation:pulse 1s infinite .4s}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

/* ── Bottom bar ───────────────────────────────────────────────────────────── */
.bottom-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.bottom-bar-left{font-size:13px;color:var(--text-secondary);font-family:'Gabarito',sans-serif}

/* ── Loading ──────────────────────────────────────────────────────────────── */
.step-row{display:flex;align-items:center;gap:12px;padding:12px 0}
.step-row+.step-row{border-top:1px solid var(--surface-2)}
.step-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .3s}
.step-dot.pending{background:var(--border)}
.step-dot.active{background:var(--blue);animation:pulse 1s ease-in-out infinite}
.step-dot.done{background:var(--green)}
.step-text{font-size:13px;display:flex;align-items:center;gap:6px;font-family:'Gabarito',sans-serif}
.step-text.pending{color:var(--text-muted)}
.step-text.active{color:var(--text-primary);font-weight:500}
.step-text.done{color:var(--text-secondary)}

/* ── Storyboard ───────────────────────────────────────────────────────────── */
.sb-frame{background:var(--surface-2);border:1.5px solid rgba(255,255,255,.08);border-radius:8px;aspect-ratio:16/9;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;cursor:grab;user-select:none;transition:border-color .15s,opacity .15s}
.sb-frame:active{cursor:grabbing}
.sb-frame.drag-over{border-color:var(--blue);background:rgba(76,133,245,0.08)}
.sb-frame.dragging{opacity:.35}
.sb-frame-num{font-size:10px;font-weight:600;color:rgba(255,255,255,.25);letter-spacing:.06em;font-family:'Inter',sans-serif}
.sb-frame-label{font-size:11px;color:rgba(255,255,255,.55);line-height:1.35;font-family:'Gabarito',sans-serif}

/* ── Generated ────────────────────────────────────────────────────────────── */
.gen-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:4px}
.gen-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.gen-thumb{position:relative;background:#0c0c0f;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gen-thumb img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.gen-play{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.3)}
.gen-info{padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.gen-label{font-size:14px;font-weight:600;color:var(--text-primary);font-family:'Gabarito',sans-serif}
.gen-actions{display:flex;gap:8px}

/* ── Brand Identity ───────────────────────────────────────────────────────── */
.bi-screen{flex:1;display:flex;flex-direction:column;overflow:hidden;animation:screenIn 220ms ease forwards}
.bi-header{display:flex;align-items:flex-start;justify-content:space-between;padding:24px 32px 0;flex-shrink:0}
.bi-title{font-family:'Gabarito',system-ui,sans-serif;font-weight:600;font-size:28px;color:var(--text-primary);letter-spacing:-0.4px;line-height:1.2}
.bi-sub{font-size:13px;color:var(--text-muted);margin-top:5px;font-family:'Gabarito',sans-serif}
.bi-panels{display:flex;gap:16px;flex:1;min-height:0;padding:20px 32px 28px}
.bi-panel{border-radius:10px;overflow:hidden;position:relative;background:#141414}
.bi-panel-main{flex:0 0 calc(57.5% - 8px);display:flex;align-items:center;justify-content:center}
.bi-panel-main img{max-width:91%;max-height:94%;object-fit:contain;display:block}
.bi-panel-secondary{flex:1}
.bi-panel-secondary img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* ── Page heading helpers ─────────────────────────────────────────────────── */
.pg-h1{font-family:'Gabarito',system-ui,sans-serif;font-weight:600;font-size:32px;color:var(--text-primary);letter-spacing:-0.4px;line-height:1.2;margin-bottom:4px}
.pg-sub{font-family:'Gabarito',system-ui,sans-serif;font-size:13px;color:var(--text-muted)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const h = React.createElement;
const {useState, useEffect, useRef} = React;

/* ── Inline SVG icons ────────────────────────────────────────────────────── */
const LogoIcon = () => h('svg',{width:16,height:16,viewBox:'0 0 16 16',fill:'none'},
  h('rect',{x:1,y:1,width:6,height:6,rx:1.5,fill:'rgba(255,255,255,0.7)'}),
  h('rect',{x:9,y:1,width:6,height:6,rx:1.5,fill:'rgba(255,255,255,0.7)'}),
  h('rect',{x:1,y:9,width:6,height:6,rx:1.5,fill:'rgba(255,255,255,0.7)'}),
  h('rect',{x:9,y:9,width:6,height:6,rx:1.5,fill:'rgba(255,255,255,0.7)'})
);

const DockGrid = () => h('svg',{width:18,height:18,viewBox:'0 0 18 18',fill:'none'},
  h('rect',{x:1,y:1,width:7,height:7,rx:1.5,fill:'white'}),
  h('rect',{x:10,y:1,width:7,height:7,rx:1.5,fill:'white'}),
  h('rect',{x:1,y:10,width:7,height:7,rx:1.5,fill:'white'}),
  h('rect',{x:10,y:10,width:7,height:7,rx:1.5,fill:'white'})
);

const DockCircle = () => h('svg',{width:18,height:18,viewBox:'0 0 18 18',fill:'none'},
  h('circle',{cx:9,cy:9,r:6.5,stroke:'white',strokeWidth:1.5})
);

const DockBox = () => h('svg',{width:18,height:18,viewBox:'0 0 18 18',fill:'none'},
  h('rect',{x:2,y:2,width:10,height:10,rx:2,stroke:'white',strokeWidth:1.5}),
  h('path',{d:'M10 8h5.5M13 5.5l2.5 2.5L13 10.5',stroke:'white',strokeWidth:1.5,strokeLinecap:'round',strokeLinejoin:'round'})
);

const DockPlay = () => h('svg',{width:18,height:18,viewBox:'0 0 18 18',fill:'none'},
  h('path',{d:'M4.5 3.5l10 5.5-10 5.5V3.5z',stroke:'white',strokeWidth:1.5,strokeLinejoin:'round'})
);

const DockCode = () => h('svg',{width:18,height:18,viewBox:'0 0 18 18',fill:'none'},
  h('path',{d:'M6 5l-4 4 4 4M12 5l4 4-4 4',stroke:'white',strokeWidth:1.5,strokeLinecap:'round',strokeLinejoin:'round'})
);

const DockGear = () => h('svg',{width:18,height:18,viewBox:'0 0 18 18',fill:'none'},
  h('circle',{cx:9,cy:9,r:2.5,stroke:'white',strokeWidth:1.5}),
  h('path',{d:'M9 2.5V4M9 14v1.5M2.5 9H4M14 9h1.5M4.4 4.4l1.1 1.1M12.5 12.5l1.1 1.1M12.5 5.5l1.1-1.1M4.4 13.6l1.1-1.1',stroke:'white',strokeWidth:1.5,strokeLinecap:'round'})
);

const CheckMini = () => h('svg',{width:11,height:11,viewBox:'0 0 12 12',fill:'none'},
  h('polyline',{points:'2 6 5 9 10 3',stroke:'white',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'})
);

const GreenCheck = () => h('svg',{width:12,height:12,viewBox:'0 0 12 12',fill:'none'},
  h('polyline',{points:'2 6 5 9 10 3',stroke:'#4ade80',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'})
);

const CalIcon = () => h('svg',{width:28,height:28,viewBox:'0 0 24 24',fill:'none',stroke:'var(--blue)',strokeWidth:1.5,strokeLinecap:'round',strokeLinejoin:'round'},
  h('rect',{x:3,y:4,width:18,height:18,rx:2}),h('line',{x1:16,y1:2,x2:16,y2:6}),
  h('line',{x1:8,y1:2,x2:8,y2:6}),h('line',{x1:3,y1:10,x2:21,y2:10})
);

/* ── Topbar ───────────────────────────────────────────────────────────────── */
function Topbar({screen, credits}) {
  const raw = Math.round(credits * 8.4);
  const crumbMap = {
    dashboard:    ['Projects'],
    brandIdentity:['Brand Identity'],
    upload:       ['Projects', 'New campaign'],
    briefing:     ['Projects', 'Summer Glow — Q3', 'Brief'],
    loading:      ['Projects', 'Summer Glow — Q3', 'Building storyboard'],
    storyboard:   ['Projects', 'Summer Glow — Q3', 'Storyboard'],
    generated:    ['Projects', 'Summer Glow — Q3', 'Generated Videos'],
  };
  const crumbs = crumbMap[screen] || ['Projects'];
  return h('div',{className:'topbar'},
    h('div',{className:'topbar-left'},
      h('div',{className:'topbar-logo'},
        h('div',{className:'topbar-logo-icon'}, h(LogoIcon)),
        h('span',{className:'topbar-logo-text'},'basicroute')
      ),
      h('div',{className:'topbar-crumb'},
        crumbs.map((c,i) => h(React.Fragment,{key:i},
          i > 0 && h('span',{className:'sep'},' / '),
          h('span',null, c)
        ))
      )

/* ── Screen 3 — Brief ─────────────────────────────────────────────────────── */
const FORMAT_EXCHANGES = [
  {ai:"Let's set up your campaign. First — are you creating image content or video content?", user:'Video',fields:{contentType:'Video'}},
  {ai:'Got it — video. Short format (TikTok/Reels, under 60s) or long format (YouTube, brand films)?', user:'Long format',fields:{format:'Long format'}},
];
const EXCHANGES = [
  {ai:"I can see Lumeo has a soft, pastel aesthetic — really clean and organic. Are you keeping that same tone for this campaign, or going for something bolder?",user:"Same tone — soft and natural. Our audience responds well to it.",fields:{brandTone:'Soft & organic',visualMood:'Clean, natural, minimal'}},
  {ai:"Got it. What's the main goal for this campaign — building brand awareness, or direct lead capture?",user:"Lead capture. We want people clicking through to our site.",fields:{campaignObjective:'Lead capture',callToAction:'Link in bio — product page'}},
  {ai:"Based on lead capture, I'd actually recommend 4 posts per week instead of 2. Higher frequency builds trust faster on TikTok. Shall I plan for that?",user:"Yes, let's do 4 per week.",fields:{postingFrequency:'4 posts / week',campaignDuration:'4 weeks · 16 posts total'}},
];
const FINAL_AI = "Brief is complete. Review it on the left and approve when you're ready.";
const ALL_EXCHANGES = [...FORMAT_EXCHANGES, ...EXCHANGES];

function S3({onNav, onCredits}) {
  const [step, setStep] = useState(0);
  const [brief, setBrief] = useState({
    contentType:'', format:'',
    brand:'Lumeo Skincare', platform:'TikTok', targetRegion:'Southeast Asia',
    campaignObjective:'', brandTone:'', visualMood:'', callToAction:'',
    postingFrequency:'', campaignDuration:''
  });
  const chatEndRef = useRef(null);
  useEffect(()=>{ if(chatEndRef.current) chatEndRef.current.scrollIntoView({behavior:'smooth'}); },[step]);

  const handleGhostClick = (idx) => {
    const ex = ALL_EXCHANGES[idx];
    setBrief(prev => ({...prev, ...ex.fields}));
    if(idx >= 2) onCredits(-8);
    setTimeout(()=>{ setStep((idx+1)*2); }, 400);
  };

  const messages = [];
  for(let i = 0; i < 5; i++) {
    const ts = i*2, gs = i*2+1;
    if(step >= ts) {
      messages.push({type:'ai', text:ALL_EXCHANGES[i].ai, typing:step===ts, key:`ai${i}`});
      if(step !== ts) {
        const replied = step > gs;
        messages.push({type:'user', text:ALL_EXCHANGES[i].user, ghost:!replied, idx:i, key:`user${i}`});
      }
    }
  }
  if(step === 10) messages.push({type:'ai', text:FINAL_AI, typing:true, key:'ai-final'});
  if(step === 11) messages.push({type:'ai', text:FINAL_AI, typing:false, key:'ai-final'});

  const allDone = step >= 11;
  const briefFields = [
    {label:'Content type',key:'contentType'},{label:'Format',key:'format'},
    {label:'Brand',key:'brand'},{label:'Platform',key:'platform'},
    {label:'Target region',key:'targetRegion'},{label:'Campaign objective',key:'campaignObjective'},
    {label:'Brand tone',key:'brandTone'},{label:'Visual mood',key:'visualMood'},
    {label:'Call to action',key:'callToAction'},{label:'Posting frequency',key:'postingFrequency'},
    {label:'Campaign duration',key:'campaignDuration'},
  ];

  return h('div',{className:'screen-pad screen-enter'},
    h('div',{className:'brief-grid'},
      h('div',{className:'card-d'},
        h('div',{className:'card-d-hdr'},
          h('span',{className:'card-d-title'},'Brief'),
          allDone && h('span',{className:'badge badge-ok'},'Ready to review')
        ),
        h('div',{className:'card-d-body'},
          briefFields.map(f => h('div',{className:'field-row',key:f.key},
            h('div',{className:'field-lbl'},f.label),
            h('div',{className:`field-val ${brief[f.key]?'field-filled':'field-empty'}`}, brief[f.key] || 'Waiting...')
          ))
        )
      ),
      h('div',{className:'card-d'},
        h('div',{className:'card-d-hdr'},
          h('span',{className:'card-d-title'},'AI assistant'),
          h('span',{className:'badge badge-blue'},'✦ Active')
        ),
        h('div',{className:'card-d-body'},
          h(ChatThread,{messages, onGhostClick:handleGhostClick, onTypingDone:(idx)=>{
            if(idx < 5) setStep(idx*2+1); else setStep(11);
          }, chatEndRef})
        )
      )
    ),
    allDone && h('div',{className:'bottom-bar'},
      h('div',null,
        h('div',{style:{fontWeight:600,fontSize:14,color:'var(--text-primary)',marginBottom:3,fontFamily:"'Gabarito',sans-serif"}},'Brief looks good?'),
        h('div',{style:{fontSize:12,color:'var(--text-muted)',fontFamily:"'Gabarito',sans-serif"}},'Approving will build your storyboard.')
      ),
      h('button',{className:'btn btn-white lg',onClick:()=>onNav('loading')},'Approve & build storyboard →')
    )
  );
}

function ChatThread({messages, onGhostClick, onTypingDone, chatEndRef}) {
  return h('div',{className:'chat-area'},
    messages.map(msg => {
      if(msg.type === 'ai') {
        return h(AiMessage,{key:msg.key,text:msg.text,typing:msg.typing,
          onDone:()=>{
            const idx = msg.key === 'ai-final' ? 5 : parseInt(msg.key.replace('ai',''));
            onTypingDone(idx);
          }
        });
      } else if(msg.ghost) {
        return h('div',{key:msg.key,className:'chat-row user'},
          h('div',{className:'chat-bubble bubble-ghost',onClick:()=>onGhostClick(msg.idx)},
            h('div',null,msg.text),
            h('div',{className:'ghost-hint'},'· tap to reply')
          ),
          h('div',{className:'chat-avatar av-user'},'LS')
        );
      } else {
        return h('div',{key:msg.key,className:'chat-row user'},
          h('div',{className:'chat-bubble bubble-user'},msg.text),
          h('div',{className:'chat-avatar av-user'},'LS')
        );
      }
    }),
    h('div',{ref:chatEndRef})
  );
}

function AiMessage({text, typing, onDone}) {
  const [done, setDone] = useState(false);
  useEffect(()=>{
    if(typing && !done) {
      const t = setTimeout(()=>{ setDone(true); onDone(); }, 1600);
      return ()=>clearTimeout(t);
    }
  },[typing]);
  useEffect(()=>{ if(!typing) setDone(true); },[]);
  const showTyping = typing && !done;
  return h('div',{className:'chat-row'},
    h('div',{className:'chat-avatar av-ai'},'AI'),
    h('div',{className:'chat-bubble bubble-ai'},
      showTyping
        ? h('div',{className:'typing-dots'},h('div',{className:'dot'}),h('div',{className:'dot'}),h('div',{className:'dot'}))
        : text
    )
  );
}

/* ── Screen 4 — Loading ───────────────────────────────────────────────────── */
function S4({onNav}) {
  const [states, setStates] = useState(['active','pending','pending','pending']);
  const steps = [
    {label:'Reading brief & brand assets', t:900},
    {label:'Planning video structure', t:2000},
    {label:'Generating storyboard frames', t:3100},
    {label:'Arranging scene order', t:4200},
  ];
  useEffect(()=>{
    const timers = [];
    steps.forEach((s,i) => {
      timers.push(setTimeout(()=>{
        setStates(prev => {
          const n = [...prev]; n[i]='done';
          if(i+1 < 4) n[i+1]='active';
          return n;
        });
      }, s.t));
    });
    timers.push(setTimeout(()=>onNav('storyboard'), 4700));
    return ()=>timers.forEach(clearTimeout);
  },[]);

  return h('div',{className:'screen-pad screen-enter',style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'60vh'}},
    h('div',{style:{textAlign:'center',maxWidth:380,width:'100%'}},
      h('div',{style:{width:60,height:60,background:'rgba(76,133,245,0.12)',border:'1px solid var(--blue-border)',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}},
        h(CalIcon)
      ),
      h('h2',{style:{fontSize:20,fontWeight:600,fontFamily:"'Gabarito',sans-serif",color:'var(--text-primary)',marginBottom:6}},'Building your storyboard'),
      h('p',{style:{fontSize:13,color:'var(--text-muted)',marginBottom:24,fontFamily:"'Gabarito',sans-serif"}},'Analysing your brief and planning video structure.'),
      h('div',{className:'card-d'},
        h('div',{className:'card-d-body'},
          steps.map((s,i) => h('div',{className:'step-row',key:s.label},
            h('div',{className:`step-dot ${states[i]}`}),
            h('div',{className:`step-text ${states[i]}`},
              states[i]==='done' && h(GreenCheck),
              s.label
            )
          ))
        )
      )
    )
  );
}

/* ── Storyboard Screen ────────────────────────────────────────────────────── */
function StoryboardScreen({onNav}) {
  const SCENE_LABELS = [
    'Product reveal','Close-up texture','Lifestyle moment','Before & after',
    'Ingredient spotlight','Morning routine','Application technique','Glow result',
    'Testimonial hook','Brand logo close','CTA overlay','End card'
  ];
  const makeFrames = () => SCENE_LABELS.map((label,i) => ({id:i,num:i+1,label}));
  const [activePost, setActivePost] = useState(0);
  const [frames, setFrames] = useState([makeFrames(),makeFrames(),makeFrames(),makeFrames()]);
  const [dragIdx, setDragIdx] = useState(null);
  const [dragOver, setDragOver] = useState(null);

  const handleDrop = (i) => {
    if(dragIdx === null || dragIdx === i){ setDragIdx(null); setDragOver(null); return; }
    setFrames(prev => prev.map((arr,pi) => {
      if(pi !== activePost) return arr;
      const copy = [...arr];
      const [item] = copy.splice(dragIdx,1);
      copy.splice(i,0,item);
      return copy;
    }));
    setDragIdx(null); setDragOver(null);
  };

  return h('div',{className:'screen-pad screen-enter'},
    h('div',{style:{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24}},
      h('div',null,
        h('h1',{className:'pg-h1'},'Storyboard'),
        h('p',{className:'pg-sub'},'Summer Glow — Q3 · 4 videos · Drag frames to reorder scenes.')
      )
    ),
    h('div',{style:{display:'flex',gap:4,marginBottom:20,borderBottom:'1px solid var(--border)'}},
      ['Video 1','Video 2','Video 3','Video 4'].map((label,i) =>
        h('div',{key:i,style:{
          padding:'10px 18px',fontSize:13,fontWeight:500,cursor:'pointer',userSelect:'none',
          fontFamily:"'Gabarito',sans-serif",
          color:activePost===i?'var(--text-primary)':'var(--text-muted)',
          borderBottom:activePost===i?'2px solid var(--text-primary)':'2px solid transparent',
          marginBottom:'-1px',transition:'color .12s,border-color .12s'
        }, onClick:()=>setActivePost(i)}, label)
      )
    ),
    h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:24}},
      frames[activePost].map((frame,i) =>
        h('div',{key:frame.id, draggable:true,
          onDragStart:()=>setDragIdx(i),
          onDragOver:e=>{ e.preventDefault(); setDragOver(i); },
          onDrop:()=>handleDrop(i),
          onDragEnd:()=>{ setDragIdx(null); setDragOver(null); },
          className:'sb-frame'+(dragIdx===i?' dragging':'')+(dragOver===i&&dragIdx!==i?' drag-over':''),
        },
          h('div',{className:'sb-frame-num'},`SCENE ${frame.num}`),
          h('div',{className:'sb-frame-label'},frame.label)
        )
      )
    ),
    h('div',{className:'bottom-bar'},
      h('span',{className:'bottom-bar-left'},'Happy with the scene order? Generate all 4 videos.'),
      h('button',{className:'btn btn-white lg',onClick:()=>onNav('generated')},'Generate Videos →')
    )
  );
}

/* ── App ──────────────────────────────────────────────────────────────────── */
function App() {
  const [screen, setScreen] = useState('dashboard');
  const [credits, setCredits] = useState(100);
  const [briefingKey, setBriefingKey] = useState(0);

  const handleNav = (s) => {
    if(s === 'briefing') setBriefingKey(k => k+1);
    setScreen(s);
  };
  const handleCredits = (delta) => setCredits(prev => Math.max(0, Math.min(100, prev+delta)));

  const screenMap = {
    dashboard:    h(S1,               {onNav:handleNav}),
    brandIdentity:h(BrandIdentityScreen, {onNav:handleNav}),
    upload:       h(S2,               {onNav:handleNav, onCredits:handleCredits}),
    briefing:     h(S3,               {key:briefingKey, onNav:handleNav, onCredits:handleCredits}),
    loading:      h(S4,               {onNav:handleNav}),
    storyboard:   h(StoryboardScreen, {onNav:handleNav}),
    generated:    h(GeneratedScreen,  {onNav:handleNav}),
  };

  return h('div',{className:'app'},
    h(Topbar,{screen, credits}),
    h('div',{className:'content-area'},
      screenMap[screen] || screenMap['dashboard']
    ),
    h(Dock,{screen, onNav:handleNav})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
